<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#64e0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Flutlicht Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: DOS-Menüleiste oben, Inhalts-Fenster mit Doppelrahmen, feste Aktionsleiste unten. Bewusst nur ein (dunkles) Farbschema. */
:root{
  --bg:#101c58; --panel:#15247a; --panel2:#1b2e90; --deep:#0a1340; --line:#4660cf;
  --fg:#e9eeff; --dim:#a6b3e8; --hi:#ffd84a; --cyan:#64e0ff; --ink:#0b1440;
  --good:#74e6a2; --bad:#ff7d7d; --warn:#ffb54a;
  --bevl:#8ea2ff; --bevd:#050a2c; --board:#05070f; --bulb:#ffcf2e;
  --f-disp:'VT323',ui-monospace,Menlo,Consolas,monospace;
  --f-body:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--deep);border:2px solid var(--line);padding:6px 8px;border-radius:2px;max-width:100%}
input:focus,select:focus{outline:none;border-color:var(--hi)}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.topbar{background:var(--cyan);color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;padding:6px 16px}
.brand{font-family:var(--f-disp);font-size:27px;line-height:1;letter-spacing:.03em}
.brand span{color:var(--panel2)}
.meta{font-size:13px;font-weight:600;min-width:0}
.cash{margin-left:auto;font-family:var(--f-disp);font-size:25px;line-height:1}
.cash.neg{color:#9b0f1c}
.menu{display:flex;gap:0;overflow-x:auto;background:var(--panel2);padding:0 8px;border-bottom:2px solid var(--line);scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu button{background:none;border:0;padding:6px 10px 4px;font-family:var(--f-disp);font-weight:400;font-size:21px;letter-spacing:.03em;color:var(--dim);white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.menu button:hover{color:var(--fg)}
.menu button.on{color:var(--hi);border-bottom-color:var(--hi)}
.menu button .dot{display:inline-block;width:7px;height:7px;background:var(--hi);border-radius:50%;margin-left:4px;vertical-align:2px}
main{padding:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:1120px;margin:0 auto}
.endbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel2);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.endbar .info{flex:1;min-width:0;font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.endbar .info b{color:var(--fg)}
.btn{background:var(--panel2);border:3px solid;border-color:var(--bevl) var(--bevd) var(--bevd) var(--bevl);padding:6px 13px;cursor:pointer;font-weight:600;border-radius:0;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn:active{border-color:var(--bevd) var(--bevl) var(--bevl) var(--bevd)}
.btn.pri{background:var(--hi);color:var(--ink);border-color:#fff3b0 #8a6a00 #8a6a00 #fff3b0}
.btn.pri:active{border-color:#8a6a00 #fff3b0 #fff3b0 #8a6a00}
.btn.pri:hover{filter:brightness(1.08)}
.btn.big{font-family:var(--f-disp);font-size:24px;font-weight:400;padding:4px 18px;line-height:1.2}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:2px}
.seg button{background:var(--deep);border:0;padding:6px 11px;cursor:pointer;font-weight:600;font-size:14px}
.seg button+button{border-left:2px solid var(--line)}
.seg button.on{background:var(--hi);color:var(--ink)}
.panel{background:var(--panel);border:3px solid;border-color:var(--bevl) var(--bevd) var(--bevd) var(--bevl);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:16px;min-width:0}
.panel>h2{margin:0;background:linear-gradient(90deg,var(--line),var(--panel2));color:#fff;font-family:var(--f-disp);font-weight:400;font-size:23px;line-height:1.15;padding:3px 12px;letter-spacing:.03em;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel>h2 small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--fg);opacity:.85;letter-spacing:0}
.bd{padding:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.grid>*{min-width:0}
.grid .panel{margin-bottom:0}
.stack{display:flex;flex-direction:column;gap:16px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 6px;text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:11.5px;color:var(--cyan);font-weight:600;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line)}
tbody tr+tr td{border-top:1px solid rgba(70,96,207,.33)}
.n{text-align:right}
.c{text-align:center}
tr.me td{background:rgba(255,216,74,.12);color:var(--hi)}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(100,224,255,.08)}
tr.zone-eu td:first-child{box-shadow:inset 4px 0 var(--cyan)}
tr.zone-up td:first-child{box-shadow:inset 4px 0 var(--good)}
tr.zone-down td:first-child{box-shadow:inset 4px 0 var(--bad)}
.dim{color:var(--dim)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .hi{color:var(--hi)}
.small{font-size:13px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan);font-weight:600}
.big-num{font-family:var(--f-disp);font-size:34px;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--dim)} .kv dd{margin:0}
.pos{display:inline-block;min-width:28px;text-align:center;font-size:12px;font-weight:700;padding:1px 4px;border-radius:2px;color:var(--ink)}
.pos.TW{background:var(--hi)} .pos.AB{background:var(--cyan)} .pos.MF{background:var(--good)} .pos.ST{background:#ff9a8a}
.badge{display:inline-block;width:14px;height:14px;border:1px solid rgba(255,255,255,.5);vertical-align:-2px;margin-right:6px;flex:none}
.meter{height:7px;background:var(--deep);border:1px solid var(--line);min-width:50px}
.meter i{display:block;height:100%}
.xi{width:28px;height:26px;border:2px solid var(--line);background:var(--deep);cursor:pointer;font-weight:700;font-size:12px;border-radius:2px}
.xi.on{background:var(--hi);color:var(--ink);border-color:var(--hi)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:0 5px;border-radius:2px;margin-left:4px;letter-spacing:.03em}
.tag.inj{background:var(--bad);color:var(--ink)} .tag.sus{background:var(--warn);color:var(--ink)} .tag.lst{background:var(--cyan);color:var(--ink)} .tag.exp{border:1px solid var(--warn);color:var(--warn)}
.news{display:flex;flex-direction:column}
.news article{padding:10px 0;border-top:1px solid rgba(70,96,207,.4)}
.news article:first-child{border-top:0;padding-top:0}
.news h3{margin:2px 0 3px;font-size:16px}
.news .when{font-size:12px;color:var(--dim)}
.news .good-k h3{color:var(--good)} .news .bad-k h3{color:var(--bad)} .news .act-k h3{color:var(--hi)}
.news p{margin:0 0 6px;max-width:70ch}
.fxl{display:flex;flex-direction:column;gap:6px}
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:6px 8px;background:var(--deep);border:1px solid rgba(70,96,207,.5)}
.fx .h{text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .a{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .s{font-family:var(--f-disp);font-size:22px;line-height:1;min-width:58px;text-align:center;color:var(--hi)}
.fx.me{border-color:var(--hi)}
.fx .w{font-weight:700}
.empty{color:var(--dim);font-style:italic}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--hi);color:var(--ink);padding:9px 16px;font-weight:600;z-index:90;max-width:calc(100% - 32px);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(4,8,32,.72);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal .panel{width:min(560px,100%);max-height:100%;overflow:auto;margin:0;box-shadow:8px 8px 0 rgba(0,0,0,.45)}
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.ov-in{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:3px double var(--line);padding-bottom:8px}
.tk-head h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:34px;line-height:1}
.clock{font-family:var(--f-disp);font-size:64px;line-height:.85;color:var(--hi);font-variant-numeric:tabular-nums}
.sb{background:var(--board);background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.4px);background-size:5px 5px;border:4px solid;border-color:#3a3f55 #000 #000 #3a3f55;padding:10px 12px}
.sb-score{text-shadow:0 0 10px rgba(255,207,46,.55)}
.sb-top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.sb-top .t{font-weight:700;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-top .t.r{text-align:right}
.sb-score{font-family:var(--f-disp);font-size:56px;line-height:.9;color:var(--bulb);letter-spacing:.04em}
.sb-meta{text-align:center;font-size:12px;color:var(--dim);margin-top:2px}
.feed{list-style:none;margin:8px 0 0;padding:0;font-size:14px;display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto}
.feed li{display:flex;gap:8px;align-items:baseline}
.feed .m{font-family:var(--f-disp);font-size:19px;width:34px;flex:none;color:var(--dim);text-align:right}
.ev{font-size:11px;font-weight:700;padding:0 5px;border-radius:2px;flex:none}
.ev.goal{background:var(--hi);color:var(--ink)} .ev.yel{background:#ffe066;color:var(--ink)} .ev.red{background:var(--bad);color:var(--ink)} .ev.inj{border:1px solid var(--bad);color:var(--bad)} .ev.sub{border:1px solid var(--cyan);color:var(--cyan)} .ev.info{border:1px solid var(--dim);color:var(--dim)}
.conf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:4px 16px}
.conf .fx{padding:4px 8px}
.conf .fx .s{font-size:20px}
.flash{animation:fl 1.2s ease-out}
@keyframes fl{0%{background:var(--hi);color:var(--ink)}100%{}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:2px solid var(--hi)}}
.ht{border:3px double var(--cyan);background:var(--panel);padding:12px}
.ht h2{margin:0 0 8px;font-family:var(--f-disp);font-weight:400;font-size:28px;color:var(--cyan)}
.ng-hero{padding:28px 0 8px;display:flex;flex-direction:column;gap:6px}
.ng-title{font-family:var(--f-disp);font-size:clamp(54px,13vw,112px);line-height:.82;margin:0;color:var(--hi);text-shadow:4px 4px 0 var(--ink);letter-spacing:.02em}
.ng-title span{display:block;color:var(--cyan)}
.ng-sub{color:var(--dim);max-width:60ch;margin:6px 0 0}
.stadium{width:100%;max-width:720px;aspect-ratio:160/56;image-rendering:pixelated;border:4px solid;border-color:var(--bevl) var(--bevd) var(--bevd) var(--bevl);display:block;margin-bottom:12px;background:var(--deep)}
.mute{margin-left:8px;background:var(--ink);color:var(--cyan);border:2px solid var(--panel2);font-family:var(--f-disp);font-size:18px;line-height:1;padding:2px 8px;cursor:pointer}
.floods{display:flex;gap:18px;margin-bottom:6px}
.floods i{width:46px;height:20px;background:repeating-linear-gradient(90deg,var(--hi) 0 6px,var(--deep) 6px 8px);border:2px solid var(--ink);box-shadow:0 0 22px rgba(255,216,74,.45)}
.ngrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:10px;padding:10px 0;border-top:1px solid rgba(70,96,207,.4)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--dim)}
.help p{max-width:70ch;margin:0 0 8px}
.help h3{margin:12px 0 4px;color:var(--cyan);font-size:15px}
textarea{width:100%;min-height:120px;background:var(--deep);color:var(--fg);border:2px solid var(--line);font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:8px}
.strbar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.strbar .meter{height:12px}
.list-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
@media (max-width:520px){.cash{font-size:22px}.brand{font-size:23px}.clock{font-size:50px}.sb-score{font-size:44px}.hide-s{display:none}}
</style><style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>

<div id="modal" class="modal" hidden></div>

function teamStr(on,style,hart){

function genSquad(t){

function newGame(cfg){

  for(let i=0;i<45;i++){const p=genPlayer(ri(48,66),pick(['TW','AB','AB','MF','MF','ST']),0,{nat:R()<.3?pick(NATS):'D'});S.free.push(p.id)}

function roundRobin(ids){
  const n=ids.length,arr=shuffle(ids.slice()),rounds=[];
  for(let r=0;r<n-1;r++){const md=[];for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];if((r+i)%2===1)[h,a]=[a,h];md.push([h,a])}rounds.push(md);arr.splice(1,0,arr.pop())}
  shuffle(rounds);
  return rounds.concat(rounds.map(md=>md.map(([h,a])=>[a,h])));
}
function boardTarget(t){
  const lg=leagueTeams(t.league).sort((a,b)=>teamRating(b)-teamRating(a));const rank=lg.indexOf(t)+1;
  if(t.league===1)return rank<=2?2:rank<=5?4:rank<=9?8:rank<=13?12:15;
  return rank<=3?3:rank<=8?8:14;
}
function makeOffers(t){
  const base=t.league===1?2500+t.fans*60:700+t.fans*25;const nm=shuffle(SPONSORS.slice());
  return [{name:nm[0],fixed:Math.round(base*1.1/10)*10,bonus:0},{name:nm[1],fixed:Math.round(base*.85/10)*10,bonus:Math.round(base*.012)},{name:nm[2],fixed:Math.round(base*.65/10)*10,bonus:Math.round(base*.03)}];
}
function chooseSponsor(t,i){t.sponsor=t.offers[i];t.offers=null}
function genYouth(t){
  for(const id of t.youth)delete S.players[id];
  t.youth=[];
  const n=ri(1,3)+(t.youthLvl>=4?1:0);
  for(let i=0;i<n;i++){
    const p=genPlayer(30,pick(POS.concat(['AB','MF','ST'])),t.id,{age:ri(16,18),nat:natFor(t),con:3});
    p.str=clamp(30+t.youthLvl*5+ri(-4,6),25,70);p.pot=clamp(p.str+ri(10,24)+t.youthLvl*3,p.str,95);p.sal=pSalary(p);p.yth=true;
    t.youth.push(p.id);
  }
  if(t.human<0){
    t.youth.sort((a,b)=>P(b).pot-P(a).pot);
    while(t.youth.length&&t.squad.length<23){const id=t.youth.shift();P(id).yth=false;t.squad.push(id)}
    for(const id of t.youth)delete S.players[id];t.youth=[];
  }
}
function startSeason(first){
  for(const lg of [1,2]){const ids=leagueTeams(lg).map(t=>t.id);S.sched[lg]=roundRobin(ids).map(md=>md.map(([h,a])=>({h,a,gh:null,ga:null})))}
  const l1=leagueTeams(1).map(t=>t.id);
  const l2=leagueTeams(2).sort((a,b)=>teamRating(b)-teamRating(a)).slice(0,14).map(t=>t.id);
  S.cup={alive:l1.concat(l2),rounds:[],winner:null};drawCup(S.cup,0,'POK');
  const ger=first?leagueTeams(1).sort((a,b)=>teamRating(b)-teamRating(a)).slice(0,4).map(t=>t.id):S.euroQual.slice(0,4);
  S.eur={alive:ger.concat(S.teams.filter(t=>t.foreign).map(t=>t.id)),rounds:[],winner:null,ger};drawCup(S.eur,0,'EUR');
  for(const t of S.teams){
    t.camp=[false,false];if(t.foreign)continue;
    if(!first)t.finLast=t.fin;t.fin=newFin();
    if(ger.includes(t.id))book(t,1000,'prize');
    genYouth(t);
    t.offers=makeOffers(t);
    if(t.human<0){chooseSponsor(t,ri(0,2));t.lineup=autoLineup(t)}else t.sponsor=null;
  }
  for(const h of S.humans)if(h.tid){h.target=boardTarget(team(h.tid));h.warned=false}
}
function drawCup(c,idx,comp){
  const names=comp==='POK'?CUP_NAMES:EUR_NAMES;const alive=shuffle(c.alive.slice());const fx=[];
  for(let i=0;i+1<alive.length;i+=2){let h=alive[i],a=alive[i+1];if(comp==='POK'&&team(a).league>team(h).league)[h,a]=[a,h];fx.push({h,a,gh:null,ga:null,pen:null,w:null})}
  c.rounds[idx]={name:names[idx]||'Runde',fx,final:alive.length===2};
}

/* =========================== AUFSTELLUNG =========================== */
function autoLineup(t){
  const need=FORMS[t.tactic.form]||FORMS['4-4-2'];
  const pl=t.squad.map(P).filter(avail).sort((a,b)=>effStr(b)-effStr(a));
  const ch=[],used=new Set();
  for(const pos of POS){let n=need[pos];for(const p of pl){if(n<=0)break;if(p.pos===pos&&!used.has(p.id)){ch.push(p.id);used.add(p.id);n--}}}
  for(const p of pl){if(ch.length>=11)break;if(!used.has(p.id)&&p.pos!=='TW'){ch.push(p.id);used.add(p.id)}}
  for(const p of pl){if(ch.length>=11)break;if(!used.has(p.id)){ch.push(p.id);used.add(p.id)}}
  return ch;
}
function matchLineup(t){
  if(t.human<0){t.lineup=autoLineup(t);return t.lineup.slice()}
  let lu=t.lineup.filter(id=>t.squad.includes(id)&&avail(P(id))).slice(0,11);
  if(lu.length<11){
    const need=FORMS[t.tactic.form];const pl=t.squad.map(P).filter(p=>avail(p)&&!lu.includes(p.id)).sort((a,b)=>effStr(b)-effStr(a));
    const cnt=c=>lu.filter(id=>P(id).pos===c).length;
    for(const pos of POS){while(cnt(pos)<need[pos]&&lu.length<11){const p=pl.find(x=>x.pos===pos&&!lu.includes(x.id));if(!p)break;lu.push(p.id)}}
    for(const p of pl){if(lu.length>=11)break;if(!lu.includes(p.id))lu.push(p.id)}
  }
  return lu;
}

/* =========================== SPIELSIMULATION =========================== */
function makeMatch(hid,aid,comp,fx,o={}){
  const H=team(hid),A=team(aid);
  const m={hid,aid,comp,fx,ko:!!o.ko,neutral:!!o.neutral,gh:0,ga:0,min:0,end:90,done:false,ev:[],on:[[],[]],gone:[new Set(),new Set()],played:[new Set(),new Set()],used:[0,0],yc:new Set(),str:[null,null],style:[H.tactic.style,A.tactic.style],hart:[H.tactic.hart,A.tactic.hart],pen:null,att:0,lastGoal:-9};
  m.on[0]=matchLineup(H);m.on[1]=matchLineup(A);
  m.on.forEach((on,s)=>on.forEach(id=>m.played[s].add(id)));
  const rh=teamRating(H),ra=teamRating(A);
  if(H.human<0)m.style[0]=rh-ra>6?'off':ra-rh>6?'def':'norm';
  if(A.human<0)m.style[1]=ra-rh>8?'off':rh-ra>4?'def':'norm';
  return m;
}
function addEv(m,s,t,p,extra={}){m.ev.push(Object.assign({min:m.min,s,t,pid:p?p.id:null,n:p?p.n:''},extra))}
function benchOf(m,s){const t=team(s?m.aid:m.hid);return t.squad.filter(id=>!m.on[s].includes(id)&&!m.gone[s].has(id)&&avail(P(id)))}
function subst(m,s,outId,inId,auto){
  if(m.used[s]>=3||!m.on[s].includes(outId)||!benchOf(m,s).includes(inId))return false;
  m.on[s]=m.on[s].map(id=>id===outId?inId:id);m.gone[s].add(outId);m.played[s].add(inId);m.used[s]++;m.str[s]=null;
  addEv(m,s,'sub',P(inId),{out:P(outId).n});return true;
}
function autoReplace(m,s,pos){
  if(m.used[s]>=3)return;
  const b=benchOf(m,s).map(P).sort((a,b)=>effStr(b)-effStr(a));
  const p=b.find(x=>x.pos===pos)||b.find(x=>x.pos!=='TW')||b[0];
  if(!p)return;
  m.on[s].push(p.id);m.played[s].add(p.id);m.used[s]++;m.str[s]=null;addEv(m,s,'sub',p,{out:'—'});
}
function simMinute(m){
  if(m.done)return;
  m.min++;
  const et=m.min>90?.85:1;
  const H=team(m.hid);
  for(let s=0;s<2;s++){
    for(let k=0;k<2;k++)if(!m.str[k])m.str[k]=teamStr(m.on[k],m.style[k],m.hart[k]);
    const me=m.str[s],op=m.str[1-s];
    let lam=1.28*Math.pow(me.att/op.def,1.7)*Math.pow(me.mid/op.mid,.6);
    if(!m.neutral)lam*=s===0?1.12:.92;
    lam=clamp(lam,.12,5.5);
    if(R()<lam/90*et)goal(m,s);
    if(R()<(m.hart[s]?.03:.021))card(m,s,false);
    if(R()<(m.hart[s]?.0018:.0011))card(m,s,true);
    const ip=.0016*(s===0&&!m.neutral&&H.stadium.heiz?.6:1);
    if(R()<ip)injury(m,s);
    const t=team(s?m.aid:m.hid);
    if(t.human<0&&(m.min===62||m.min===76)&&m.used[s]<3){
      const tired=m.on[s].map(P).filter(p=>p.pos!=='TW').sort((a,b)=>a.fit-b.fit)[0];
      if(tired){const b=benchOf(m,s).map(P).filter(p=>p.pos===tired.pos).sort((a,b)=>effStr(b)-effStr(a))[0];if(b)subst(m,s,tired.id,b.id,true)}
    }
  }
  if(m.min>=m.end){
    if(m.end===90&&m.ko&&m.gh===m.ga){m.end=120;addEv(m,-1,'info',null,{txt:'Verlängerung'})}
    else{if(m.ko&&m.gh===m.ga)penalties(m);m.done=true}
  }
}
function goal(m,s){
  const on=m.on[s].map(P);if(!on.length)return;
  const p=wpick(on,on.map(p=>({TW:.02,AB:.7,MF:2.4,ST:6}[p.pos])*(p.str/70)));
  if(s)m.ga++;else m.gh++;m.lastGoal=m.min;addEv(m,s,'goal',p,{sc:`${m.gh}:${m.ga}`});
}
function card(m,s,red){
  const on=m.on[s].map(P);if(!on.length)return;
  const p=wpick(on,on.map(p=>({TW:.3,AB:3,MF:2,ST:1.4}[p.pos])));
  let gr=false;if(!red&&m.yc.has(p.id)){red=true;gr=true}
  if(red){m.on[s]=m.on[s].filter(i=>i!==p.id);m.gone[s].add(p.id);m.str[s]=null;addEv(m,s,'red',p,{gr});
    if(p.pos==='TW'){const t=team(s?m.aid:m.hid);if(t.human<0||true)autoKeeper(m,s)}}
  else{m.yc.add(p.id);addEv(m,s,'yel',p)}
}
function autoKeeper(m,s){
  if(m.used[s]>=3)return;
  const kp=benchOf(m,s).map(P).find(p=>p.pos==='TW');if(!kp)return;
  const field=m.on[s].map(P).filter(p=>p.pos!=='TW').sort((a,b)=>a.str-b.str)[0];
  if(field)subst(m,s,field.id,kp.id,true);
}
function injury(m,s){
  const on=m.on[s].map(P);if(!on.length)return;
  const p=pick(on);const w=ri(2,6);p.inj=w;
  m.on[s]=m.on[s].filter(i=>i!==p.id);m.gone[s].add(p.id);m.str[s]=null;addEv(m,s,'inj',p,{w});
  autoReplace(m,s,p.pos);
}
function penalties(m){let a=0,b=0;for(let i=0;i<5;i++){if(R()<.76)a++;if(R()<.76)b++}while(a===b){if(R()<.76)a++;if(R()<.76)b++}m.pen=[a,b];addEv(m,-1,'info',null,{txt:`Elfmeterschießen ${a}:${b}`})}
function attendance(t,opp,comp,exact){
  const s=t.stadium;let base=t.fans*650*(t.league===1?1:.6);
  if(comp==='POK')base*=1.1;if(comp==='EUR')base*=1.4;
  base*=1+((opp?opp.fans:50)-50)/180;if(s.roof)base*=1.08;if(s.tafel)base*=1.03;
  const j=()=>exact?1:rnd(.9,1.1);
  const steh=Math.round(Math.min(s.steh,base*.55*Math.pow(12/Math.max(t.price.steh,1),1.25)*j()));
  const sitz=Math.round(Math.min(s.sitz,base*.45*Math.pow(28/Math.max(t.price.sitz,1),1.25)*j()));
  const logen=Math.round(s.logen*Math.min(1,base/30000));
  return {steh,sitz,logen,total:steh+sitz,inc:(steh*t.price.steh+sitz*t.price.sitz+logen*900)/1000};
}
function finishMatch(m){
  const H=team(m.hid),A=team(m.aid),f=m.fx;
  f.gh=m.gh;f.ga=m.ga;if(m.pen)f.pen=m.pen.slice();
  if(m.ko)f.w=m.gh>m.ga?m.hid:m.ga>m.gh?m.aid:(m.pen[0]>m.pen[1]?m.hid:m.aid);
  const league=m.comp[0]==='L';
  for(let s=0;s<2;s++){
    const t=s?A:H,my=s?m.ga:m.gh,op=s?m.gh:m.ga;let res=my>op?1:my<op?-1:0;if(m.ko&&res===0)res=f.w===t.id?1:-1;
    for(const id of m.played[s]){const p=P(id);if(!p)continue;p.fit=clamp(p.fit-ri(6,11),20,100);if(league)p.sp++;p.form=clamp(p.form+(res>0?.5:res<0?-.35:.05),1,10)}
    if(league&&!t.foreign){t.fans=clamp(t.fans+(res>0?.4:res<0?-.3:0),5,99);if(res>0&&t.sponsor&&t.sponsor.bonus)book(t,t.sponsor.bonus,'sponsor')}
    if(t.human>=0&&league){const c=S.humans[t.human].career;if(res>0)c.s++;else if(res<0)c.n++;else c.u++}
  }
  for(const e of m.ev){const p=e.pid?P(e.pid):null;if(!p)continue;
    if(e.t==='goal'){if(league)p.g++;else p.gx++}
    else if(e.t==='yel'){if(league){p.yel++;if(p.yel%5===0)p.sus=Math.max(p.sus,2)}}
    else if(e.t==='red')p.sus=Math.max(p.sus,e.gr?2:ri(2,3));}
  if(!m.neutral&&!H.foreign){const a=attendance(H,A,m.comp);book(H,a.inc,'ticket');m.att=a.total}
}
function finishRound(r){
  for(const m of r.matches)finishMatch(m);
  if(r.cup){
    const c=r.cup,rd=c.rounds[r.idx],prize=(r.comp==='POK'?CUP_PRIZE:EUR_PRIZE)[r.idx]||0,winners=[];
    for(const f of rd.fx){winners.push(f.w);const wt=team(f.w);if(!wt.foreign)book(wt,prize,'prize')}
    c.alive=winners;
    if(winners.length===1){c.winner=winners[0];const wt=team(c.winner);
      if(wt.human>=0){S.humans[wt.human].titles.push(`${r.comp==='POK'?'Pokalsieger':'Europapokalsieger'} ${yearLabel()} mit ${wt.name}`);
        addNews(wt.human,r.comp==='POK'?'POKALSIEG!':'EUROPAPOKAL GEWONNEN!',`${wt.name} holt den ${r.comp==='POK'?'DFB-Pokal':'Europapokal'}! Die Stadt feiert, der Vorstand ist begeistert.`,{kind:'good'});S.humans[wt.human].conf=clamp(S.humans[wt.human].conf+15,0,100)}}
    else drawCup(c,r.idx+1,r.comp);
  }
}
function weekRounds(){
  const rounds=[];
  const ci=CUP_WEEKS.indexOf(S.week);if(ci>=0&&S.cup&&!S.cup.winner){const r=cupRound(S.cup,ci,'POK');if(r)rounds.push(r)}
  const ei=EUR_WEEKS.indexOf(S.week);if(ei>=0&&S.eur&&!S.eur.winner){const r=cupRound(S.eur,ei,'EUR');if(r)rounds.push(r)}
  if(S.week<=34){const ms=[];for(const lg of [1,2])for(const f of S.sched[lg][S.week-1])ms.push(makeMatch(f.h,f.a,'L'+lg,f));rounds.push({label:`${S.week}. Spieltag`,comp:'LIGA',matches:ms})}
  return rounds;
}
function cupRound(c,idx,comp){
  if(!c.rounds[idx])drawCup(c,idx,comp);const rd=c.rounds[idx];if(!rd.fx.length)return null;
  return {label:(comp==='POK'?'DFB-Pokal':'Europapokal')+' · '+rd.name,comp,idx,cup:c,matches:rd.fx.map(f=>makeMatch(f.h,f.a,comp,f,{ko:true,neutral:rd.final}))};
}
function computeTable(lg){
  const rows={};for(const t of leagueTeams(lg))rows[t.id]={id:t.id,sp:0,s:0,u:0,n:0,tf:0,ta:0,pts:0,last:[]};
  for(const md of S.sched[lg])for(const f of md){if(f.gh==null)continue;const h=rows[f.h],a=rows[f.a];if(!h||!a)continue;
    const W=S.year<1995?2:3;h.sp++;a.sp++;h.tf+=f.gh;h.ta+=f.ga;a.tf+=f.ga;a.ta+=f.gh;
    if(f.gh>f.ga){h.s++;a.n++;h.pts+=W;h.last.push('S');a.last.push('N')}else if(f.gh<f.ga){a.s++;h.n++;a.pts+=W;h.last.push('N');a.last.push('S')}else{h.u++;a.u++;h.pts++;a.pts++;h.last.push('U');a.last.push('U')}}
  return Object.values(rows).sort((x,y)=>y.pts-x.pts||(y.tf-y.ta)-(x.tf-x.ta)||y.tf-x.tf||team(x.id).name.localeCompare(team(y.id).name));
}
const tablePos=t=>computeTable(t.league).findIndex(r=>r.id===t.id)+1;
function topScorers(lg){return Object.values(S.players).filter(p=>p.tid&&!p.yth&&p.g>0&&!team(p.tid).foreign&&team(p.tid).league===lg).sort((a,b)=>b.g-a.g||a.sp-b.sp).slice(0,15)}

/* =========================== WOCHE =========================== */
function weeklyEconomy(t){
  const sal=t.squad.reduce((s,id)=>s+P(id).sal,0)/34;
  book(t,-sal,'salary');
  book(t,-((t.stadium.steh+t.stadium.sitz)*.0004+t.stadium.logen*.5),'stadium');
  book(t,-t.youthLvl*6,'youth');
  book(t,t.league===1?260:90,"tv");
  if(t.sponsor)book(t,t.sponsor.fixed/34,'sponsor');
}
function weeklyTraining(t){
  const it=t.train,rec=it==='leicht'?20:it==='hart'?9:14,g=it==='leicht'?.6:it==='hart'?1.5:1,injP=it==='hart'?.008:it==='normal'?.002:.0005;
  for(const id of t.squad){const p=P(id);
    if(p.inj>0)p.inj--;if(p.sus>0)p.sus--;
    p.fit=clamp(p.fit+rec,0,100);
    const base=p.age<=20?.25:p.age<=23?.15:p.age<=27?.06:0;
    if(p.str<p.pot&&R()<base*g)p.str++;
    if(p.age>=31&&R()<.015*(p.age-29))p.str=Math.max(18,p.str-1);
    p.form=clamp(p.form+rnd(-.5,.5)+(5-p.form)*.08+(it==='hart'?.05:0),1,10);
    if(p.inj===0&&R()<injP){p.inj=ri(2,3);if(t.human>=0)addNews(t.human,'Trainingsverletzung',`${p.n} hat sich im Training verletzt und fällt ${p.inj-1} Woche(n) aus.`,{kind:'bad'})}
  }
}
function progressBuild(t){
  for(const b of t.build){b.left--;if(b.left<=0){applyBuild(t,b);if(t.human>=0)addNews(t.human,'Bauarbeiten abgeschlossen',`${BUILD[b.k].label}: fertig. Das Stadion fasst jetzt ${num(t.stadium.steh+t.stadium.sitz)} Zuschauer.`,{kind:'good'})}}
  t.build=t.build.filter(b=>b.left>0);
}
function applyBuild(t,b){const s=t.stadium;if(b.k==='steh')s.steh+=2000;else if(b.k==='sitz')s.sitz+=2000;else if(b.k==='umbau'){s.steh=Math.max(0,s.steh-2000);s.sitz+=2000}else if(b.k==='logen')s.logen+=10;else s[b.k]=true;if(b.k==='tafel')t.fans=clamp(t.fans+3,5,99)}
function aiWeekly(t){
  const av=t.squad.map(P).filter(avail);
  if(av.length<14||t.squad.length<18){
    const cnt=c=>t.squad.filter(id=>P(id).pos===c).length;const need=POS.find(c=>cnt(c)<({TW:2,AB:6,MF:6,ST:4}[c]))||pick(['AB','MF','ST']);
    const fa=S.free.map(P).filter(p=>p.pos===need).sort((a,b)=>b.str-a.str)[0];
    if(fa){S.free=S.free.filter(i=>i!==fa.id);fa.tid=t.id;fa.con=ri(1,2);fa.sal=pSalary(fa);t.squad.push(fa.id)}
    else{const p=genPlayer(t.foreign?t.q:clamp(teamRating(t)-4,45,80),need,t.id,{nat:natFor(t)});t.squad.push(p.id)}
  }
}
function addNews(hi,title,text,o={}){
  const arr=S.news[hi]=S.news[hi]||[];
  arr.unshift({id:S.nextId++,y:yearLabel(),w:S.week,title,text,acts:o.acts||null,data:o.data||null,done:false,kind:o.kind||'info',res:''});
  if(arr.length>80)arr.length=80;
}
function goalNames(m,s){const g=m.ev.filter(e=>e.t==='goal'&&e.s===s);return g.length?g.map(e=>`${e.n.split(' ').slice(-1)[0]} (${e.min}.)`).join(', '):''}
function resultNews(hi,t,rounds){
  for(const r of rounds)for(const m of r.matches){
    if(m.hid!==t.id&&m.aid!==t.id)continue;
    const home=m.hid===t.id,s=home?0:1,my=home?m.gh:m.ga,op=home?m.ga:m.gh,o=team(home?m.aid:m.hid);
    const won=my>op||(my===op&&m.fx.w===t.id&&m.ko),lost=my<op||(my===op&&m.ko&&m.fx.w!==t.id);
    const d=my-op;let title;
    if(m.ko){title=won?(m.comp==='POK'?pick(['Weiter im Pokal!','Pokalcoup!','Nächste Runde erreicht']):pick(['Europas Bühne ruft weiter','Internationaler Erfolg!'])):pick(['Aus und vorbei','Ausgeschieden','Endstation'])}
    else if(d>=3)title=pick(['Gala-Vorstellung!','Schützenfest!','Machtdemonstration']);
    else if(d>0)title=pick(['Drei Punkte eingefahren','Arbeitssieg','Wichtiger Sieg']);
    else if(d===0)title=pick(['Punkteteilung','Remis','Ein Punkt bleibt']);
    else if(d<=-3)title=pick(['Debakel!','Bittere Klatsche','Rabenschwarzer Tag']);
    else title=pick(['Knappe Niederlage','Leer ausgegangen','Niederlage']);
    const sc=`${team(m.hid).short} – ${team(m.aid).short} ${m.gh}:${m.ga}${m.pen?` (i. E. ${m.pen[0]}:${m.pen[1]})`:''}`;
    const gn=goalNames(m,s);
    addNews(hi,title,`${r.label}: ${sc}.${gn?' Tore für uns: '+gn+'.':''}${m.att?` ${num(m.att)} Zuschauer.`:''}`,{kind:won?'good':lost?'bad':'info'});
  }
}
function boardWeekly(hi,t,rounds){
  const h=S.humans[hi];const pos=tablePos(t);let d=0;
  const lr=rounds.find(r=>r.comp==='LIGA');
  if(lr){const m=lr.matches.find(m=>m.hid===t.id||m.aid===t.id);if(m){const my=m.hid===t.id?m.gh:m.ga,op=m.hid===t.id?m.ga:m.gh;d+=my>op?1.5:my<op?-1.5:0}}
  if(S.week>=6)d+=clamp((h.target-pos)*.25,-2,2);
  if(t.cash<-5000)d-=1.5;
  h.conf=clamp(h.conf+d,0,100);
  if(t.cash<-10000)return fire(hi,'Der Schuldenberg ist zu groß geworden. Der Vorstand zieht die Notbremse.');
  if(h.conf<12&&S.week>=8)return fire(hi,'Die sportliche Talfahrt ist dem Vorstand zu viel.');
  if(h.conf<28&&!h.warned){h.warned=true;addNews(hi,'Der Vorstand ist unzufrieden',`Das Vertrauen sinkt. Ziel bleibt: ${TARGET_TXT[t.league][h.target]}. Ohne Besserung droht die Entlassung.`,{kind:'bad'})}
  if(h.conf>40)h.warned=false;
}
function fire(hi,reason){
  const h=S.humans[hi],t=team(h.tid);t.human=-1;t.lineup=autoLineup(t);t.offers&&chooseSponsor(t,0);
  for(const id of t.squad)P(id).listed=false;
  addNews(hi,'ENTLASSEN',`${reason} Du bist nicht mehr Manager von ${t.name}. Im Büro warten neue Angebote.`,{kind:'bad'});
  h.tid=null;h.conf=55;
  const free=domestic().filter(x=>x.human<0&&x.id!==t.id).sort((a,b)=>teamRating(a)-teamRating(b));
  h.offers=shuffle(free.slice(0,14)).slice(0,3).map(x=>x.id);
}
function takeJob(hi,tid){
  const h=S.humans[hi],t=team(tid);if(t.human>=0)return;
  h.tid=tid;h.offers=null;t.human=hi;h.conf=55;h.target=boardTarget(t);h.warned=false;t.lineup=autoLineup(t);
  addNews(hi,`Neuer Job: ${t.name}`,`Der Vorstand erwartet: ${TARGET_TXT[t.league][h.target]}.`,{kind:'act'});
}
function randomEvent(hi,t){
  const r=R();
  if(r<.4){const p=t.squad.map(P).sort((a,b)=>b.str-a.str).slice(0,8);const pl=pick(p);if(!pl)return;
    addNews(hi,'Gehaltsforderung',`${pl.n} (${POSN[pl.pos]}, Stärke ${pl.str}) verlangt 25 % mehr Gehalt: ${money(Math.round(pl.sal*1.25))} statt ${money(pl.sal)} pro Saison.`,{kind:'act',data:{pid:pl.id},acts:[['raiseY','Zustimmen'],['raiseN','Ablehnen']]})}
  else if(r<.7){const amt=t.league===1?ri(25,50)*10:ri(10,25)*10;
    addNews(hi,'Freundschaftsspiel angeboten',`Ein Veranstalter bietet ${money(amt)} für ein Testspiel unter der Woche. Die Spieler verlieren dabei etwas Fitness.`,{kind:'act',data:{amount:amt},acts:[['friendY','Annehmen'],['friendN','Absagen']]})}
  else addNews(hi,'Fanclub fordert günstigere Tickets',`Der Fanclub-Dachverband bittet um 2 DM Rabatt auf Stehplätze (aktuell ${t.price.steh} DM). Sonst drohen Proteste.`,{kind:'act',acts:[['fanY','Preis senken'],['fanN','Ablehnen']]});
}
function bidsForListed(hi,t){
  for(const id of t.squad){const p=P(id);if(!p.listed||R()>.45)continue;
    const buyers=domestic().filter(x=>x.human<0&&x.squad.length<28);if(!buyers.length)continue;const b=pick(buyers);
    const amt=Math.round(pValue(p)*rnd(.75,1.2)/10)*10;
    addNews(hi,'Angebot für '+p.n,`${b.name} bietet ${money(amt)} Ablöse (Marktwert ${money(pValue(p))}). Das Angebot gilt bis zum nächsten Spieltag.`,{kind:'act',data:{pid:p.id,tid:b.id,amount:amt},acts:[['bidY','Verkaufen'],['bidN','Ablehnen']]});
  }
}
function expireActions(){for(const k in S.news)for(const n of S.news[k])if(n.acts&&!n.done&&n.w<S.week){n.done=true;n.res='Keine Antwort, Angebot verfallen.'}}
function transferPlayer(p,toTid,fee){
  if(p.tid){const from=team(p.tid);from.squad=from.squad.filter(i=>i!==p.id);from.lineup=from.lineup.filter(i=>i!==p.id);book(from,fee,'transfer')}
  else S.free=S.free.filter(i=>i!==p.id);
  const to=team(toTid);to.squad.push(p.id);p.tid=toTid;p.listed=false;book(to,-fee,'transfer');
}
function releasePlayer(p){
  if(p.tid){const t=team(p.tid);t.squad=t.squad.filter(i=>i!==p.id);t.lineup=t.lineup.filter(i=>i!==p.id)}
  p.tid=0;p.listed=false;p.con=0;if(!S.free.includes(p.id))S.free.push(p.id);
}
function removePlayer(p){
  if(p.tid){const t=team(p.tid);t.squad=t.squad.filter(i=>i!==p.id);t.lineup=t.lineup.filter(i=>i!==p.id);t.youth=t.youth.filter(i=>i!==p.id)}
  S.free=S.free.filter(i=>i!==p.id);delete S.players[p.id];
}
function endWeek(rounds){
  const wk=S.week;
  for(const t of domestic())if(t.offers&&t.human>=0){chooseSponsor(t,0);addNews(t.human,'Sponsor automatisch gewählt',`Weil keine Entscheidung fiel, hat der Vorstand ${t.sponsor.name} genommen.`)}
  S.lastWeek=[];for(const r of rounds)for(const m of r.matches)S.lastWeek.push({label:r.label,comp:m.comp,h:m.hid,a:m.aid,gh:m.gh,ga:m.ga,pen:m.pen,att:m.att});
  for(const t of S.teams){weeklyTraining(t);if(!t.foreign){weeklyEconomy(t);progressBuild(t)}}
  for(const t of S.teams)if(t.human<0)aiWeekly(t);
  S.humans.forEach((h,hi)=>{
    if(!h.tid)return;const t=team(h.tid);
    resultNews(hi,t,rounds);
    boardWeekly(hi,t,rounds);
    if(!h.tid)return;
    bidsForListed(hi,t);
    if(R()<.22)randomEvent(hi,t);
    if(wk===28){const ex=t.squad.map(P).filter(p=>p.con<=1);if(ex.length)addNews(hi,'Auslaufende Verträge',`Diese Verträge enden mit der Saison: ${ex.map(p=>p.n).join(', ')}. Verlängere im Kader, sonst gehen die Spieler ablösefrei.`,{kind:'act'})}
  });
  S.week++;expireActions();
  if(S.week>34)seasonEnd();
  S.turn=0;
}
function maintainAI(t){
  const q=t.foreign?t.q:(t.league===1?clamp(teamRating(t),60,80):clamp(teamRating(t),48,66));
  const cnt=c=>t.squad.filter(id=>P(id).pos===c).length;
  for(const [pos,n] of [['TW',2],['AB',6],['MF',6],['ST',4]])while(cnt(pos)<n){const p=genPlayer(q-2,pos,t.id,{age:ri(18,26),nat:natFor(t)});t.squad.push(p.id)}
  while(t.squad.length<21){const p=genPlayer(q-2,pick(['AB','MF','ST']),t.id,{age:ri(18,26),nat:natFor(t)});t.squad.push(p.id)}
  while(t.squad.length>25){const w=t.squad.map(P).filter(p=>p.pos!=='TW'||cnt('TW')>2).sort((a,b)=>effStr(a)-effStr(b))[0];if(!w)break;releasePlayer(w)}
}
function seasonEnd(){
  const t1=computeTable(1),t2=computeTable(2),ts=topScorers(1)[0];
  S.history.unshift({y:yearLabel(),m1:team(t1[0].id).name,m2:team(t2[0].id).name,pok:S.cup.winner?team(S.cup.winner).name:'–',eur:S.eur.winner?team(S.eur.winner).name:'–',tj:ts?`${ts.n} (${team(ts.tid).short}, ${ts.g})`:'–'});
  const down=t1.slice(-3).map(r=>r.id),up=t2.slice(0,3).map(r=>r.id);
  S.humans.forEach((h,hi)=>{
    if(!h.tid)return;const t=team(h.tid),tbl=t.league===1?t1:t2,pos=tbl.findIndex(r=>r.id===t.id)+1;
    let d=pos<=h.target?15+(h.target-pos)*2:-(pos-h.target)*4;
    if(down.includes(t.id))d-=20;if(up.includes(t.id))d+=10;
    if(pos===1){h.titles.push(`${t.league===1?'Meister':'Zweitliga-Meister'} ${yearLabel()} mit ${t.name}`);d+=10}
    h.conf=clamp(h.conf+d,0,100);
    addNews(hi,`Saisonbilanz ${yearLabel()}`,`${t.name} beendet die Saison auf Platz ${pos} (${tbl[pos-1].pts} Punkte). Ziel war: ${TARGET_TXT[t.league][h.target]}.${down.includes(t.id)?' Der Abstieg ist bitter.':''}${up.includes(t.id)?' AUFSTIEG in die Bundesliga!':''}`,{kind:pos<=h.target?'good':'bad'});
    if(h.conf<12)fire(hi,'Nach dieser Saison trennt sich der Verein von dir.');
  });
  down.forEach(id=>{const t=team(id);t.league=2;t.fans=clamp(t.fans-8,5,99)});
  up.forEach(id=>{const t=team(id);t.league=1;t.fans=clamp(t.fans+8,5,99)});
  S.euroQual=t1.slice(0,4).map(r=>r.id);
  for(const p of Object.values(S.players)){
    if(p.yth)continue;p.age++;
    if(p.age<=23)p.str=Math.min(p.pot,p.str+ri(0,4));else if(p.age<=29)p.str=clamp(p.str+ri(-1,2),18,p.pot+2);else if(p.age<=32)p.str-=ri(0,3);else p.str-=ri(1,5);
    p.str=clamp(p.str,18,96);if(p.str>p.pot)p.pot=p.str;
    p.g=0;p.gx=0;p.sp=0;p.yel=0;p.sus=0;p.form=5;p.fit=100;
    const t=p.tid?team(p.tid):null;const hum=t&&t.human>=0;
    if(p.age>=37||(p.age>=35&&R()<.6)||(p.age>=32&&p.str<40&&R()<.5)){if(hum)addNews(t.human,'Karriereende',`${p.n} (${p.age}) beendet seine Laufbahn.`);removePlayer(p);continue}
    if(t){p.con--;if(p.con<=0){
      if(hum){addNews(t.human,'Vertrag ausgelaufen',`${p.n} verlässt den Verein ablösefrei.`);releasePlayer(p)}
      else if(p.age<33&&R()<.75){p.con=ri(1,3);p.sal=pSalary(p)}else releasePlayer(p)}}
  }
  S.free=S.free.filter(id=>S.players[id]);
  const fr=S.free.map(P).sort((a,b)=>b.str-a.str);for(const p of fr.slice(70))removePlayer(p);
  for(let i=0;i<10;i++){const p=genPlayer(ri(50,66),pick(['TW','AB','MF','MF','ST','AB']),0,{nat:R()<.3?pick(NATS):'D'});S.free.push(p.id)}
  for(const t of S.teams)if(t.human<0){maintainAI(t);if(t.foreign)t.q=clamp(t.q+ri(-2,2),64,84)}
  S.year++;S.week=1;
  startSeason(false);
  S.humans.forEach((h,hi)=>{if(!h.tid)return;const t=team(h.tid);t.lineup=t.lineup.filter(id=>t.squad.includes(id));
    addNews(hi,`Neue Saison ${yearLabel()}`,`${t.name} spielt in der ${t.league===1?'Bundesliga':'2. Bundesliga'}. Vorgabe des Vorstands: ${TARGET_TXT[t.league][h.target]}. Neue Sponsorangebote liegen vor, und in der Jugendabteilung warten Talente.`,{kind:'act'})});
}

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function snapshotMeta(){const t=S.humans.map(h=>h.tid?team(h.tid).short:'ohne Verein').join(', ');return `${yearLabel()} · ${Math.min(S.week,34)}. Spieltag · ${t}`}
function saveTo(k){return lsSet(k,JSON.stringify({meta:snapshotMeta(),at:new Date().toLocaleString('de-DE'),s:S}))}
function loadFrom(k){const raw=lsGet(k);if(!raw)return false;try{const d=JSON.parse(raw);if(!d.s||!d.s.teams)return false;S=d.s;return true}catch(e){return false}}

function weekFixturesFor(tid){
  const out=[];const t=team(tid);
  const ci=CUP_WEEKS.indexOf(S.week);if(ci>=0&&!S.cup.winner&&S.cup.alive.includes(tid)&&S.cup.rounds[ci]){const f=S.cup.rounds[ci].fx.find(f=>f.h===tid||f.a===tid);if(f)out.push({comp:'Pokal',f})}
  const ei=EUR_WEEKS.indexOf(S.week);if(ei>=0&&!S.eur.winner&&S.eur.alive.includes(tid)&&S.eur.rounds[ei]){const f=S.eur.rounds[ei].fx.find(f=>f.h===tid||f.a===tid);if(f)out.push({comp:'Europa',f})}
  if(S.week<=34){const f=S.sched[t.league][S.week-1].find(f=>f.h===tid||f.a===tid);if(f)out.push({comp:'Liga',f})}
  return out;
}

function fixRow(f,me,label){
  const played=f.gh!=null;const pen=f.pen?`<div class="small dim c">i. E. ${f.pen[0]}:${f.pen[1]}</div>`:'';
  return `<div class="fx${f.h===me||f.a===me?' me':''}"><div class="h${played&&(f.gh>f.ga||(f.pen&&f.pen[0]>f.pen[1]))?' w':''}">${tname(f.h)}</div><div><div class="s">${played?f.gh+':'+f.ga:'–:–'}</div>${pen}${label?`<div class="small dim c">${esc(label)}</div>`:''}</div><div class="a${played&&(f.ga>f.gh||(f.pen&&f.pen[1]>f.pen[0]))?' w':''}">${tname(f.a)}</div></div>`;
}

function viewTactics(){
  const t=curTeam();const me=teamStr(matchLineupPreview(t),t.tactic.style,t.tactic.hart);
  const others=leagueTeams(t.league).filter(x=>x!==t).map(x=>teamStr(autoLineup(x),'norm',false));
  const avg=k=>others.reduce((a,b)=>a+b[k],0)/others.length;
  const bar=(k,l)=>{const v=me[k],a=avg(k);return `<div class="strbar"><span class="lbl">${l}</span>${meter(v,95,v>=a?'var(--good)':'var(--warn)')}<span class="n">${v.toFixed(1)}</span></div><div class="small dim" style="margin:0 0 8px 52px">Ligaschnitt ${a.toFixed(1)}</div>`};
  return `<div class="grid"><div class="panel"><h2>Taktik</h2><div class="bd">
   <div class="lbl">System</div><div class="seg" style="margin:4px 0 12px">${Object.keys(FORMS).map(f=>`<button data-act="setForm" data-f="${f}" class="${f===t.tactic.form?'on':''}">${f}</button>`).join('')}</div>
   <div class="lbl">Ausrichtung</div><div class="seg" style="margin:4px 0 12px">${Object.entries(STYLES).map(([k,l])=>`<button data-act="setStyle" data-s="${k}" class="${k===t.tactic.style?'on':''}">${l}</button>`).join('')}</div>

  </div></div>
  <div class="panel"><h2>Mannschaftsstärke <small>aktuelle Startelf</small></h2><div class="bd">${bar('def','Abw')}${bar('mid','Mit')}${bar('att','Ang')}<p class="small dim">Stärke berücksichtigt Form und Fitness. Mehr Stürmer heben den Angriff, mehr Verteidiger die Abwehr.</p></div></div></div>`;

function askPrice(p){if(!p.tid)return 0;const t=team(p.tid);let f=p.listed?1:1.35;if(t.foreign)f*=1.2;const top=t.squad.map(P).sort((a,b)=>b.str-a.str).slice(0,3);if(!p.listed&&top.includes(p))f*=1.6;return Math.round(pValue(p)*f/10)*10}
function wageDemand(p){return Math.max(p.sal,Math.round(pSalary(p)*1.1/5)*5)}
function viewMarket(){
  const me=curTeam(),f=UI.mk;
  let list=Object.values(S.players).filter(p=>!p.yth&&(p.tid===0||(p.tid&&team(p.tid).human<0)));
  if(f.pos)list=list.filter(p=>p.pos===f.pos);
  if(f.src==='free')list=list.filter(p=>!p.tid);else if(f.src==='l1')list=list.filter(p=>p.tid&&!team(p.tid).foreign&&team(p.tid).league===1);else if(f.src==='l2')list=list.filter(p=>p.tid&&!team(p.tid).foreign&&team(p.tid).league===2);else if(f.src==='int')list=list.filter(p=>p.tid&&team(p.tid).foreign);else if(f.src==='young')list=list.filter(p=>p.age<=21);
  if(f.max)list=list.filter(p=>askPrice(p)<=+f.max);
  list.sort(f.sort==='price'?(a,b)=>askPrice(a)-askPrice(b):f.sort==='age'?(a,b)=>a.age-b.age||b.str-a.str:(a,b)=>b.str-a.str);
  list=list.slice(0,60);
  const mine=me.squad.map(P).filter(p=>p.listed);
  return `<div class="panel"><h2>Transfermarkt <small>Kasse ${money(me.cash)} · Kader ${me.squad.length}/30</small></h2><div class="bd">
   <div class="row" style="margin-bottom:10px">
    <div class="seg">${[['','Alle'],['TW','TW'],['AB','AB'],['MF','MF'],['ST','ST']].map(([k,l])=>`<button data-act="mk" data-k="pos" data-v="${k}" class="${f.pos===k?'on':''}">${l}</button>`).join('')}</div>
    <select id="mk-src" data-chg="mkSrc" aria-label="Herkunft">${[['all','Alle Spieler'],['free','Vereinslos'],['l1','Bundesliga'],['l2','2. Bundesliga'],['int','Ausland'],['young','Talente bis 21']].map(([k,l])=>`<option value="${k}"${f.src===k?' selected':''}>${l}</option>`).join('')}</select>
    <select id="mk-max" data-chg="mkMax" aria-label="Höchstpreis"><option value="">Preis egal</option>${[0,500,1000,2000,4000,8000].map(v=>`<option value="${v}"${f.max==v&&f.max!==''?' selected':''}>bis ${v?money(v):'ablösefrei'}</option>`).join('')}</select>

   </div>
   <div class="tw"><table><thead><tr><th>Name</th><th>Pos</th><th class="n">Alter</th><th class="n">Stärke</th><th>Verein</th><th class="n">Ablöse</th><th class="n hide-s">Gehalt</th></tr></thead><tbody>
   ${list.map(p=>`<tr class="click" data-act="buyModal" data-id="${p.id}"><td>${esc(p.n)}${p.listed?'<span class="tag lst">gelistet</span>':''}</td><td>${posChip(p)}</td><td class="n">${p.age}</td><td class="n"><b>${p.str}</b></td><td>${p.tid?tname(p.tid,true):'<span class="dim">vereinslos</span>'}</td><td class="n">${p.tid?money(askPrice(p)):'frei'}</td><td class="n hide-s">${money(wageDemand(p))}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Keine Spieler gefunden.</td></tr>'}
   </tbody></table></div></div></div>
   <div class="panel"><h2>Meine Transferliste</h2><div class="bd">${mine.length?mine.map(p=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${posChip(p)} ${esc(p.n)} · Wert ${money(pValue(p))}</span><button class="btn sm" data-act="list" data-id="${p.id}">Zurückziehen</button></div>`).join(''):'<p class="empty">Keine Spieler gelistet. Setze Spieler im Kader auf die Liste.</p>'}</div></div>`;

function buyModal(id){
  const p=P(id),me=curTeam();const ask=askPrice(p),wage=wageDemand(p);const blocked=p.noDeal===S.year*100+S.week;

function tryBuy(id,fct){
  const t=curTeam(),p=P(id),ask=askPrice(p),fee=Math.round(ask*fct/10)*10,wage=wageDemand(p),extra=p.tid?0:Math.round(wage*.25),yrs=UI.buyY||2;
  if(t.squad.length>=30)return toast('Kader voll: maximal 30 Spieler.');
  if(t.cash-fee-extra<-2000)return toast('Nicht genug Geld. Der Kreditrahmen liegt bei 2 Mio. DM.');
  if(p.tid){const from=team(p.tid);if(from.squad.length<=16)return toast(`${from.name} gibt keine Spieler mehr ab.`);
    const acc=fct>=1.2?1:fct>=1?.85:.35;if(R()>acc){p.noDeal=S.year*100+S.week;closeModal();toast(`${from.name} lehnt das Angebot ab.`);render();return}}
  const fromName=p.tid?team(p.tid).name:'vereinslos';
  transferPlayer(p,t.id,fee);if(extra)book(t,-extra,'transfer');p.sal=wage;p.con=yrs;
  addNews(S.turn,'Neuzugang: '+p.n,`${p.n} (${POSN[p.pos]}, ${p.age} Jahre, Stärke ${p.str}) kommt ${p.tid&&fee?'für '+money(fee)+' ':''}von ${fromName}. Vertrag bis ${S.year+yrs}.`,{kind:'good'});
  closeModal();toast(`${p.n} unterschreibt!`);render();
}

/* =========================== TICKER =========================== */
let TK=null;
const SPEED={langsam:420,normal:150,schnell:45};
function humanInMatch(m){return team(m.hid).human>=0||team(m.aid).human>=0}
function playWeek(){TK={rounds:weekRounds(),ri:0,timer:null,live:null,ht:false,htDone:false};nextRound()}
function nextRound(){
  while(TK.ri<TK.rounds.length){
    const r=TK.rounds[TK.ri];
    if(S.settings.speed==='sofort'||!r.matches.some(humanInMatch)){for(const m of r.matches)while(!m.done)simMinute(m);finishRound(r);r.fin=true;TK.ri++;continue}
    TK.live=r;TK.ht=false;TK.htDone=false;r.fin=false;$('#ov').hidden=false;for(const m of r.matches)m._seen=0;sndMode('match');sndWhistle([1.1]);renderTicker();startTimer();return;
  }
  endWeek(TK.rounds);sndMode('menu');showSummary();
}
function startTimer(){stopTimer();TK.timer=setInterval(tick,SPEED[S.settings.speed]||150)}
function stopTimer(){if(TK&&TK.timer){clearInterval(TK.timer);TK.timer=null}}
function tick(){
  const r=TK.live;if(!r)return;
  for(const m of r.matches)if(!m.done)simMinute(m);
  sndEvents(r);
  const mins=r.matches.filter(m=>!m.done).map(m=>m.min);
  if(S.settings.halftime&&!TK.htDone&&r.matches.some(m=>humanInMatch(m)&&m.min===45&&!m.done)){TK.htDone=true;TK.ht=true;stopTimer();sndWhistle([.55,.9]);renderTicker();return}
  if(!mins.length){stopTimer();finishRound(r);r.fin=true;sndWhistle([.22,.22,1.2])}
  renderTicker();
}
function skipRound(){const r=TK.live;stopTimer();for(const m of r.matches)while(!m.done)simMinute(m);for(const m of r.matches)m._seen=m.ev.length;TK.ht=false;finishRound(r);r.fin=true;sndWhistle([.22,.22,1.2]);renderTicker()}

  const txt=e.t==='goal'?`<b>${esc(e.n)}</b> (${esc(side)}) · ${e.sc}`:e.t==='sub'?`${esc(e.n)} für ${esc(e.out)} (${esc(side)})`:e.t==='inj'?`${esc(e.n)} (${esc(side)}) muss raus`:e.t==='info'?esc(e.txt):`${esc(e.n)} (${esc(side)})`;

  const cards=hm.map(([m])=>{const fl=m.lastGoal===m.min&&!r.fin?' flash':'';return `<div class="sb"><div class="sb-top"><div class="t r">${tname(m.hid)}</div><div class="sb-score${fl}">${m.gh}:${m.ga}</div><div class="t">${tname(m.aid)}</div></div><div class="sb-meta">${m.done?(m.pen?`i. E. ${m.pen[0]}:${m.pen[1]} · `:'')+'Abpfiff':m.min+'. Minute'}${m.min>90&&!m.done?' · Verlängerung':''}</div><ul class="feed">${m.ev.slice().reverse().slice(0,12).map(e=>evLine(e,m)).join('')||'<li class="dim small">Anpfiff …</li>'}</ul></div>`}).join('');

function htPanel(hm){

/* =========================== SOUND =========================== */
/* Eigene Komposition und synthetische Geräusche, alles per Web Audio erzeugt. */
const SND={ctx:null,on:{music:true,sfx:true},vol:.7,mode:'menu',seqT:null,step:0,next:0,crowd:null,crowdT:null,chantAt:0,lastChime:0};
function sndLoad(){try{const d=JSON.parse(lsGet('flm_audio')||'{}');if(d.on)SND.on=Object.assign(SND.on,d.on);if(typeof d.vol==='number')SND.vol=d.vol}catch(e){}}
function sndSave(){lsSet('flm_audio',JSON.stringify({on:SND.on,vol:SND.vol}))}
function muteBtn(){const on=SND.on.music||SND.on.sfx;return `<button class="mute" data-act="mute" aria-label="${on?'Ton aus':'Ton an'}" title="${on?'Ton aus':'Ton an'}">♪ ${on?'AN':'AUS'}</button>`}
function sndInit(){
  if(SND.ctx){if(SND.ctx.state==='suspended')SND.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let c;try{c=new AC()}catch(e){return}
  SND.ctx=c;SND.master=c.createGain();SND.master.gain.value=SND.vol;SND.master.connect(c.destination);
  const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(SND.master);
  SND.mus=c.createGain();SND.mus.gain.value=0;SND.mus.connect(comp);
  SND.fx=c.createGain();SND.fx.gain.value=1;SND.fx.connect(comp);
  const n=c.sampleRate*3,w=c.createBuffer(1,n,c.sampleRate),b=c.createBuffer(1,n,c.sampleRate),wd=w.getChannelData(0),bd=b.getChannelData(0);let last=0;
  for(let i=0;i<n;i++){const x=Math.random()*2-1;wd[i]=x;last=(last+.02*x)/1.02;bd[i]=last*3.5}
  SND.noise=w;SND.brown=b;
  sndApplyMode();
}
function sndMode(m){SND.mode=m;sndApplyMode()}
function sndApplyMode(){
  const c=SND.ctx;if(!c)return;const t=c.currentTime;
  const wantM=SND.on.music&&SND.mode==='menu';
  SND.mus.gain.cancelScheduledValues(t);SND.mus.gain.setTargetAtTime(wantM?1:0,t,.35);
  if(wantM&&!SND.seqT){SND.next=c.currentTime+.08;SND.seqT=setInterval(seqTick,25)}
  if(!wantM&&SND.seqT){setTimeout(()=>{if(!(SND.on.music&&SND.mode==='menu')&&SND.seqT){clearInterval(SND.seqT);SND.seqT=null}},1600)}
  if(SND.on.sfx&&SND.mode==='match')crowdStart();else crowdStop();
}
const NOTE=n=>{const m=/^([A-G])(#?)(\d)$/.exec(n);const k={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0)+12*(+m[3]+1);return 440*Math.pow(2,(k-69)/12)};
const CHORD={Am:['A2','A3','C4','E4'],F:['F2','F3','A3','C4'],C:['C3','C4','E4','G4'],G:['G2','G3','B3','D4'],Em:['E2','E3','G3','B3'],Dm:['D3','D4','F4','A4']};
const SONG=(()=>{
  const A=[['Am','E5:4 A5:2 G5:2 E5:4 D5:2 C5:2'],['F','C5:4 F5:4 E5:2 D5:2 C5:4'],['C','G4:2 C5:2 E5:4 G5:4 E5:4'],['G','D5:6 B4:2 G4:4 -:4']];
  const A2=[['Am','E5:4 A5:2 G5:2 E5:4 D5:2 C5:2'],['F','C5:4 F5:4 E5:2 D5:2 C5:4'],['C','G4:2 C5:2 E5:4 G5:2 A5:2 G5:4'],['G','B5:6 A5:2 G5:4 D5:4']];
  const B=[['F','A5:4 G5:2 F5:2 E5:4 F5:4'],['G','G5:4 F5:2 E5:2 D5:4 B4:4'],['Em','E5:2 G5:2 B5:4 A5:4 G5:4'],['Am','A5:8 E5:4 -:4']];
  const B2=[['Dm','F5:4 E5:2 D5:2 A5:4 F5:4'],['G','G5:4 A5:2 B5:2 D6:4 B5:4'],['C','C6:6 B5:2 G5:4 E5:4'],['G','D5:4 G5:4 B5:4 -:4']];
  return [...A,...A2,...B,...B2].map(([ch,mel])=>{const m={};let st=0;for(const tok of mel.split(' ')){const [nn,l]=tok.split(':');if(nn!=='-')m[st]=[NOTE(nn),+l];st+=+l}return {ch,m}});
})();
const STEP=60/124/4;
function seqTick(){const c=SND.ctx;while(SND.next<c.currentTime+.12){playStep(SND.step,SND.next);SND.next+=STEP;SND.step=(SND.step+1)%(16*SONG.length)}}
function tone(type,f,t,dur,g,dest,att){const c=SND.ctx;const o=c.createOscillator(),a=c.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+(att||.005));a.gain.setTargetAtTime(0,t+dur*.75,dur*.2+.01);o.connect(a);a.connect(dest);o.start(t);o.stop(t+dur+.4);return o}
function noiseHit(t,dur,g,type,freq,dest,q,buf){const c=SND.ctx;const s=c.createBufferSource();s.buffer=buf||SND.noise;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||1;const a=c.createGain();a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(a);a.connect(dest);s.start(t,Math.random()*2);s.stop(t+dur+.05)}
function kick(t,g,dest){const c=SND.ctx;const o=c.createOscillator(),a=c.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(a);a.connect(dest);o.start(t);o.stop(t+.3)}
function playStep(step,t){
  const bar=SONG[Math.floor(step/16)%SONG.length],s=step%16,ch=CHORD[bar.ch],D=SND.mus;
  if(s===0||s===8||s===10)kick(t,.55,D);

/* ---------- Stadion ---------- */
function crowdStart(){
  if(SND.crowd||!SND.ctx)return;const c=SND.ctx;
  const src=c.createBufferSource();src.buffer=SND.brown;src.loop=true;
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=650;bp.Q.value=.55;
  const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=180;
  const g=c.createGain();g.gain.value=0;src.connect(bp);bp.connect(hp);hp.connect(g);g.connect(SND.fx);src.start();
  g.gain.setTargetAtTime(.5,c.currentTime,1.2);SND.crowd={src,g,bp};SND.crowdT=setInterval(crowdLife,1700);SND.chantAt=c.currentTime+rnd(5,10);
}
function crowdStop(){if(!SND.crowd)return;const c=SND.ctx,{src,g}=SND.crowd;g.gain.cancelScheduledValues(c.currentTime);g.gain.setTargetAtTime(0,c.currentTime,.5);try{src.stop(c.currentTime+3)}catch(e){}SND.crowd=null;clearInterval(SND.crowdT);SND.crowdT=null}
function crowdLife(){
  const c=SND.ctx;if(!SND.crowd)return;const t=c.currentTime;const ht=typeof TK!=='undefined'&&TK&&TK.ht;
  SND.crowd.g.gain.setTargetAtTime(ht?rnd(.18,.26):rnd(.38,.62),t,.9);SND.crowd.bp.frequency.setTargetAtTime(rnd(520,860),t,1.2);
  if(t>SND.chantAt){pick(ht?[claps]:[chant,chant,claps,drums])(t+.05);SND.chantAt=t+rnd(9,20)}

function voices(t,notes,g,vowel){
  const c=SND.ctx;const bus=c.createGain();bus.gain.value=g;
  const F=vowel==='a'?[[750,5],[1150,6]]:[[480,5],[880,6]];
  for(const [fr,q] of F){const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fr;f.Q.value=q;bus.connect(f);f.connect(SND.fx)}
  for(let v=0;v<9;v++){let tt=t+rnd(0,.05);const det=rnd(-22,22);const oct=v%3===0?.5:1;
    for(const [n,d] of notes){if(n!=='-'){const o=c.createOscillator(),a=c.createGain();o.type='sawtooth';o.frequency.value=NOTE(n)*oct;o.detune.value=det+rnd(-8,8);
      a.gain.setValueAtTime(0,tt);a.gain.linearRampToValueAtTime(.18,tt+.07);a.gain.setValueAtTime(.18,tt+d*.8);a.gain.linearRampToValueAtTime(0,tt+d);

function chant(t){voices(t,pick([
  [['G3',.42],['G3',.42],['A3',.28],['G3',.28],['E3',.9],['-',.25],['G3',.42],['G3',.42],['A3',.28],['G3',.28],['C4',1.1]],
  [['C4',.3],['C4',.3],['C4',.3],['D4',.3],['E4',.6],['C4',.6],['-',.2],['D4',.3],['D4',.3],['D4',.3],['E4',.3],['C4',1]],
  [['E3',.6],['G3',.6],['A3',1.2],['-',.3],['E3',.6],['G3',.6],['A3',1.2]]

function claps(t){const pat=[0,.48,.96,1.2,1.44];for(let r=0;r<3;r++)for(const p of pat)for(let i=0;i<14;i++)noiseHit(t+r*2+p+rnd(-.03,.03),.07,.05,'bandpass',rnd(1400,2600),SND.fx,1.2)}
function drums(t){const pat=[0,.5,1,1.25,1.5];for(let r=0;r<4;r++)for(const p of pat){kick(t+r*2+p,.5,SND.fx);for(let i=0;i<8;i++)noiseHit(t+r*2+p+rnd(-.02,.03),.06,.035,'bandpass',1800,SND.fx,1.2)}}
function sndWhistle(pat){
  if(!SND.ctx||!SND.on.sfx)return;const c=SND.ctx;let t=c.currentTime+.02;
  for(const d of pat){const g=c.createGain();g.gain.value=0;g.connect(SND.fx);
    const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=32;lg.gain.value=.05;lfo.connect(lg);lg.connect(g.gain);
    for(const f of [2850,3020]){const o=c.createOscillator();o.frequency.value=f;o.connect(g);o.start(t);o.stop(t+d+.05)}
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.setValueAtTime(.08,t+d-.04);g.gain.linearRampToValueAtTime(0,t+d);lfo.start(t);lfo.stop(t+d+.05);t+=d+.16}
}
function cheer(big){
  if(!SND.ctx||!SND.on.sfx)return;const c=SND.ctx,t=c.currentTime;
  const s=c.createBufferSource();s.buffer=SND.noise;s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1100;f.Q.value=.45;const g=c.createGain();
  const pk=big?.9:.45;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+.45);g.gain.setValueAtTime(pk,t+(big?2.6:1.2));g.gain.exponentialRampToValueAtTime(.001,t+(big?6:3));
  s.connect(f);f.connect(g);g.connect(SND.fx);s.start(t);s.stop(t+6.2);
  if(big){voices(t+.3,[['G3',.6],['A3',2.2]],.55,'o');SND.chantAt=c.currentTime+4}
}
function groan(){
  if(!SND.ctx||!SND.on.sfx)return;const c=SND.ctx,t=c.currentTime;
  const s=c.createBufferSource();s.buffer=SND.brown;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(220,t+1.8);
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.9,t+.25);g.gain.exponentialRampToValueAtTime(.001,t+2.4);s.connect(f);f.connect(g);g.connect(SND.fx);s.start(t,rnd(0,1));s.stop(t+2.5);
  for(let i=0;i<10;i++)setTimeout(()=>sndWhistleFan(),300+i*rnd(80,180));
}
function sndWhistleFan(){if(!SND.ctx)return;const c=SND.ctx,t=c.currentTime;const o=c.createOscillator(),g=c.createGain();const f0=rnd(1800,3200);o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*rnd(.6,.85),t+.5);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.012,t+.05);g.gain.linearRampToValueAtTime(0,t+.55);o.connect(g);g.connect(SND.fx);o.start(t);o.stop(t+.6)}
function chime(){if(!SND.ctx||!SND.on.sfx)return;const c=SND.ctx,t=c.currentTime;if(t-SND.lastChime<1.2)return;SND.lastChime=t;tone('sine',NOTE('E6'),t,.22,.12,SND.fx);tone('sine',NOTE('C6'),t+.18,.35,.12,SND.fx)}
function blip(){if(!SND.ctx||!SND.on.sfx||SND.mode!=='menu')return;const c=SND.ctx;tone('square',980,c.currentTime,.03,.025,SND.fx)}
function sndEvents(r){
  if(!SND.ctx)return;
  for(const m of r.matches){const evs=m.ev.slice(m._seen||0);m._seen=m.ev.length;if(!evs.length)continue;
    const hh=team(m.hid).human>=0,ha=team(m.aid).human>=0;
    for(const e of evs){
      if(hh||ha){
        if(e.t==='goal'){const mine=(e.s===0&&hh)||(e.s===1&&ha);if(mine)cheer(true);else groan()}
        else if(e.t==='red')sndWhistle([.4]);
        else if(e.t==='info'&&e.txt==='Verlängerung')sndWhistle([.6,.6]);
      }else if(e.t==='goal')chime();
    }}
}
/* ---------- Pixel-Stadion ---------- */
function drawStadium(){
  const cv=document.getElementById('stadium');if(!cv)return;const x=cv.getContext('2d');const W=160,H=56;
  x.fillStyle='#0a1340';x.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){x.fillStyle=i%3?'#24357f':'#3a4ea8';x.fillRect(ri(0,W),ri(0,14),1,1)}
  x.fillStyle='#1b2a6e';x.fillRect(0,14,W,20);
  const cols=['#e8e8e8','#ffd84a','#ff6b6b','#64e0ff','#74e6a2','#ff9a3c','#c08bff','#2b2b2b'];
  for(let yy=15;yy<34;yy++)for(let xx=0;xx<W;xx++)if(Math.random()<.62){x.fillStyle=pick(cols);x.fillRect(xx,yy,1,1)}
  for(const fx of [8,152]){x.fillStyle='#64e0ff';x.fillRect(fx,4,1,30);x.fillStyle='#ffd84a';x.fillRect(fx-4,1,9,4);x.fillStyle='#0b1440';for(let k=-3;k<5;k+=2)x.fillRect(fx+k,1,1,4);
    x.fillStyle='rgba(255,230,140,.12)';x.beginPath();x.moveTo(fx-4,5);x.lineTo(fx+5,5);x.lineTo(fx<80?70:150,56);x.lineTo(fx<80?10:90,56);x.fill()}
  x.fillStyle='#000';x.fillRect(64,3,32,9);x.fillStyle='#ffcf2e';x.font='7px monospace';x.textBaseline='top';x.fillText('1 : 0',68,4);
  for(let yy=34;yy<H;yy++){x.fillStyle=Math.floor((yy-34)/4)%2?'#1f7a3a':'#25893f';x.fillRect(0,yy,W,1)}
  x.fillStyle='#e9eeff';x.fillRect(4,35,W-8,1);x.fillRect(80,35,1,H-35);
  x.strokeStyle='#e9eeff';x.lineWidth=1;x.beginPath();x.ellipse(80.5,47,10,6,0,0,Math.PI*2);x.stroke();
  x.fillRect(4,35,1,H-35);x.fillRect(W-5,35,1,H-35);
  [[60,44,'#c8102e'],[72,50,'#c8102e'],[95,41,'#fde100'],[104,49,'#fde100'],[88,46,'#c8102e']].forEach(([px,py,c])=>{x.fillStyle=c;x.fillRect(px,py,2,3);x.fillStyle='#f2d0a9';x.fillRect(px,py-1,2,1)});
  x.fillStyle='#fff';x.fillRect(84,48,1,1);
}

function resolveNews(id,k){
  const arr=S.news[S.turn]||[];const n=arr.find(x=>x.id===id);if(!n||n.done)return;const t=curTeam();const d=n.data||{};
  switch(k){
    case 'raiseY':{const p=P(d.pid);if(p&&p.tid===t.id){p.sal=Math.round(p.sal*1.25);p.form=clamp(p.form+1.5,1,10);n.res=`Gehalt erhöht. ${p.n} ist motiviert.`}else n.res='Hat sich erledigt.';break}
    case 'raiseN':{const p=P(d.pid);if(p&&p.tid===t.id){p.form=clamp(p.form-2.5,1,10);n.res=`${p.n} ist verärgert, seine Form leidet.`}else n.res='Hat sich erledigt.';break}
    case 'friendY':book(t,d.amount,'other');for(const id of t.squad){const p=P(id);p.fit=clamp(p.fit-8,0,100)}n.res=`${money(d.amount)} kassiert.`;break;
    case 'friendN':n.res='Abgesagt.';break;
    case 'fanY':t.price.steh=Math.max(3,t.price.steh-2);t.fans=clamp(t.fans+3,5,99);n.res=`Stehplatz kostet jetzt ${t.price.steh} DM. Die Fans sind dankbar.`;break;
    case 'fanN':t.fans=clamp(t.fans-2,5,99);n.res='Die Fans protestieren mit Spruchbändern.';break;
    case 'bidY':{const p=P(d.pid);if(p&&p.tid===t.id&&t.squad.length>16){transferPlayer(p,d.tid,d.amount);n.res=`${p.n} wechselt für ${money(d.amount)} zu ${team(d.tid).name}.`}else n.res='Transfer nicht mehr möglich.';break}
    case 'bidN':n.res='Angebot abgelehnt.';break;
  }
  n.done=true;render();
}

if(typeof document!=='undefined'){
  sndLoad();
  document.addEventListener('pointerdown',e=>{sndInit();if(e.target.closest('button,.click'))blip()},{capture:true});
  document.addEventListener('keydown',()=>sndInit(),{once:true});
  document.addEventListener('visibilitychange',()=>{if(!SND.ctx)return;if(document.hidden)SND.ctx.suspend();else SND.ctx.resume()});
  document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){if(el.tagName==='A')e.preventDefault();f(el.dataset,el,e)}});
  document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

  try{window.claude?.hot?.snapshot?.(()=>({S,UI:{view:UI.view,lg:UI.lg}}))}catch(e){}
  const boot=data=>{if(data&&data.S&&data.S.teams){S=data.S;Object.assign(UI,data.UI||{})}render()};
  try{window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{})}catch(e){boot({})}
}
