<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#64e0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flutlicht">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Flutlicht Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: DOS-Menüleiste oben, Inhalts-Fenster mit Doppelrahmen, feste Aktionsleiste unten. Bewusst nur ein (dunkles) Farbschema. */
:root{
  --bg:#101c58; --panel:#15247a; --panel2:#1b2e90; --deep:#0a1340; --line:#4660cf;
  --fg:#e9eeff; --dim:#a6b3e8; --hi:#ffd84a; --cyan:#64e0ff; --ink:#0b1440;
  --good:#74e6a2; --bad:#ff7d7d; --warn:#ffb54a;
  --bevl:#8ea2ff; --bevd:#050a2c; --board:#05070f; --bulb:#ffcf2e;
  --f-disp:'VT323',ui-monospace,Menlo,Consolas,monospace;
  --f-body:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--deep);border:2px solid var(--line);padding:6px 8px;border-radius:2px;max-width:100%}
input:focus,select:focus{outline:none;border-color:var(--hi)}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.topbar{background:var(--cyan);color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;padding:6px 16px}
.brand{font-family:var(--f-disp);font-size:27px;line-height:1;letter-spacing:.03em}
.brand span{color:var(--panel2)}
.meta{font-size:13px;font-weight:600;min-width:0}
.cash{margin-left:auto;font-family:var(--f-disp);font-size:25px;line-height:1}
.cash.neg{color:#9b0f1c}
.menu{display:flex;gap:0;overflow-x:auto;background:var(--panel2);padding:0 8px;border-bottom:2px solid var(--line);scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu button{background:none;border:0;padding:6px 10px 4px;font-family:var(--f-disp);font-weight:400;font-size:21px;letter-spacing:.03em;color:var(--dim);white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.menu button:hover{color:var(--fg)}
.menu button.on{color:var(--hi);border-bottom-color:var(--hi)}
.menu button .dot{display:inline-block;width:7px;height:7px;background:var(--hi);border-radius:50%;margin-left:4px;vertical-align:2px}
main{padding:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:1120px;margin:0 auto}
.endbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel2);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.endbar .info{flex:1;min-width:0;font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.endbar .info b{color:var(--fg)}
.btn{background:var(--panel2);border:3px solid;border-color:var(--bevl) var(--bevd) var(--bevd) var(--bevl);padding:6px 13px;cursor:pointer;font-weight:600;border-radius:0;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn:active{border-color:var(--bevd) var(--bevl) var(--bevl) var(--bevd)}
.btn.pri{background:var(--hi);color:var(--ink);border-color:#fff3b0 #8a6a00 #8a6a00 #fff3b0}
.btn.pri:active{border-color:#8a6a00 #fff3b0 #fff3b0 #8a6a00}
.btn.pri:hover{filter:brightness(1.08)}
.btn.big{font-family:var(--f-disp);font-size:24px;font-weight:400;padding:4px 18px;line-height:1.2}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:2px}
.seg button{background:var(--deep);border:0;padding:6px 11px;cursor:pointer;font-weight:600;font-size:14px}
.seg button+button{border-left:2px solid var(--line)}
.seg button.on{background:var(--hi);color:var(--ink)}
.panel{background:var(--panel);border:3px solid;border-color:var(--bevl) var(--bevd) var(--bevd) var(--bevl);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:16px;min-width:0}
.panel>h2{margin:0;background:linear-gradient(90deg,var(--line),var(--panel2));color:#fff;font-family:var(--f-disp);font-weight:400;font-size:23px;line-height:1.15;padding:3px 12px;letter-spacing:.03em;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel>h2 small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--fg);opacity:.85;letter-spacing:0}
.bd{padding:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.grid>*{min-width:0}
.grid .panel{margin-bottom:0}
.stack{display:flex;flex-direction:column;gap:16px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 6px;text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:11.5px;color:var(--cyan);font-weight:600;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line)}
tbody tr+tr td{border-top:1px solid rgba(70,96,207,.33)}
.n{text-align:right}
.c{text-align:center}
tr.me td{background:rgba(255,216,74,.12);color:var(--hi)}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(100,224,255,.08)}
tr.zone-eu td:first-child{box-shadow:inset 4px 0 var(--cyan)}
tr.zone-up td:first-child{box-shadow:inset 4px 0 var(--good)}
tr.zone-down td:first-child{box-shadow:inset 4px 0 var(--bad)}
.dim{color:var(--dim)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .hi{color:var(--hi)}
.small{font-size:13px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan);font-weight:600}
.big-num{font-family:var(--f-disp);font-size:34px;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--dim)} .kv dd{margin:0}
.pos{display:inline-block;min-width:28px;text-align:center;font-size:12px;font-weight:700;padding:1px 4px;border-radius:2px;color:var(--ink)}
.pos.TW{background:var(--hi)} .pos.AB{background:var(--cyan)} .pos.MF{background:var(--good)} .pos.ST{background:#ff9a8a}
.badge{display:inline-block;width:14px;height:14px;border:1px solid rgba(255,255,255,.5);vertical-align:-2px;margin-right:6px;flex:none}
.meter{height:7px;background:var(--deep);border:1px solid var(--line);min-width:50px}
.meter i{display:block;height:100%}
.xi{width:28px;height:26px;border:2px solid var(--line);background:var(--deep);cursor:pointer;font-weight:700;font-size:12px;border-radius:2px}
.xi.on{background:var(--hi);color:var(--ink);border-color:var(--hi)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:0 5px;border-radius:2px;margin-left:4px;letter-spacing:.03em}
.tag.inj{background:var(--bad);color:var(--ink)} .tag.sus{background:var(--warn);color:var(--ink)} .tag.lst{background:var(--cyan);color:var(--ink)} .tag.exp{border:1px solid var(--warn);color:var(--warn)}
.news{display:flex;flex-direction:column}
.news article{padding:10px 0;border-top:1px solid rgba(70,96,207,.4)}
.news article:first-child{border-top:0;padding-top:0}
.news h3{margin:2px 0 3px;font-size:16px}
.news .when{font-size:12px;color:var(--dim)}
.news .good-k h3{color:var(--good)} .news .bad-k h3{color:var(--bad)} .news .act-k h3{color:var(--hi)}
.news p{margin:0 0 6px;max-width:70ch}
.fxl{display:flex;flex-direction:column;gap:6px}
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:6px 8px;background:var(--deep);border:1px solid rgba(70,96,207,.5)}
.fx .h{text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .a{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .s{font-family:var(--f-disp);font-size:22px;line-height:1;min-width:58px;text-align:center;color:var(--hi)}
.fx.me{border-color:var(--hi)}
.fx .w{font-weight:700}
.empty{color:var(--dim);font-style:italic}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--hi);color:var(--ink);padding:9px 16px;font-weight:600;z-index:90;max-width:calc(100% - 32px);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(4,8,32,.72);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal .panel{width:min(560px,100%);max-height:100%;overflow:auto;margin:0;box-shadow:8px 8px 0 rgba(0,0,0,.45)}
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.ov-in{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:3px double var(--line);padding-bottom:8px}
.tk-head h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:34px;line-height:1}
.clock{font-family:var(--f-disp);font-size:64px;line-height:.85;color:var(--hi);font-variant-numeric:tabular-nums}
.sb{background:var(--board);background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.4px);background-size:5px 5px;border:4px solid;border-color:#3a3f55 #000 #000 #3a3f55;padding:10px 12px}
.sb-score{text-shadow:0 0 10px rgba(255,207,46,.55)}
.sb-top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.sb-top .t{font-weight:700;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-top .t.r{text-align:right}
.sb-score{font-family:var(--f-disp);font-size:56px;line-height:.9;color:var(--bulb);letter-spacing:.04em}
.sb-meta{text-align:center;font-size:12px;color:var(--dim);margin-top:2px}
.feed{list-style:none;margin:8px 0 0;padding:0;font-size:14px;display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto}
.feed li{display:flex;gap:8px;align-items:baseline}
.feed .m{font-family:var(--f-disp);font-size:19px;width:34px;flex:none;color:var(--dim);text-align:right}
.ev{font-size:11px;font-weight:700;padding:0 5px;border-radius:2px;flex:none}
.ev.goal{background:var(--hi);color:var(--ink)} .ev.yel{background:#ffe066;color:var(--ink)} .ev.red{background:var(--bad);color:var(--ink)} .ev.inj{border:1px solid var(--bad);color:var(--bad)} .ev.sub{border:1px solid var(--cyan);color:var(--cyan)} .ev.info{border:1px solid var(--dim);color:var(--dim)}
.conf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:4px 16px}
.conf .fx{padding:4px 8px}
.conf .fx .s{font-size:20px}
.flash{animation:fl 1.2s ease-out}
@keyframes fl{0%{background:var(--hi);color:var(--ink)}100%{}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:2px solid var(--hi)}}
.ht{border:3px double var(--cyan);background:var(--panel);padding:12px}
.ht h2{margin:0 0 8px;font-family:var(--f-disp);font-weight:400;font-size:28px;color:var(--cyan)}
.ng-hero{padding:28px 0 8px;display:flex;flex-direction:column;gap:6px}
.ng-title{font-family:var(--f-disp);font-size:clamp(54px,13vw,112px);line-height:.82;margin:0;color:var(--hi);text-shadow:4px 4px 0 var(--ink);letter-spacing:.02em}
.ng-title span{display:block;color:var(--cyan)}
.ng-sub{color:var(--dim);max-width:60ch;margin:6px 0 0}
.stadium{width:100%;max-width:720px;aspect-ratio:160/56;image-rendering:pixelated;border:4px solid;border-color:var(--bevl) var(--bevd) var(--bevd) var(--bevl);display:block;margin-bottom:12px;background:var(--deep)}
.mute{margin-left:8px;background:var(--ink);color:var(--cyan);border:2px solid var(--panel2);font-family:var(--f-disp);font-size:18px;line-height:1;padding:2px 8px;cursor:pointer}
.floods{display:flex;gap:18px;margin-bottom:6px}
.floods i{width:46px;height:20px;background:repeating-linear-gradient(90deg,var(--hi) 0 6px,var(--deep) 6px 8px);border:2px solid var(--ink);box-shadow:0 0 22px rgba(255,216,74,.45)}
.ngrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:10px;padding:10px 0;border-top:1px solid rgba(70,96,207,.4)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--dim)}
.pitch{position:relative;width:min(100%,440px);aspect-ratio:68/100;margin:0 auto;background:repeating-linear-gradient(0deg,#1f7a3a 0 8%,#25893f 8% 16%);border:3px solid #e9eeff;touch-action:pan-y;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pitch .pl{position:absolute;border:2px solid rgba(233,238,255,.75);pointer-events:none}
.pitch .half{left:0;right:0;top:50%;height:0;border-width:2px 0 0}
.pitch .circ{left:50%;top:50%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%}
.pitch .box1{left:22%;right:22%;top:-2px;height:15%}.pitch .box2{left:22%;right:22%;bottom:-2px;height:15%}
.pitch .zone{position:absolute;left:4px;font-family:var(--f-disp);font-size:15px;color:rgba(233,238,255,.4);pointer-events:none}
.pitch .z1{top:4%}.pitch .z2{top:36%}.pitch .z3{top:62%}
.tok{position:absolute;transform:translate(-50%,-50%);width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:0;background:var(--ink);color:var(--fg);border:2px solid var(--bevl);padding:2px 2px 4px;cursor:grab;font-size:11px;line-height:1.15;touch-action:pan-y;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .12s}
.tok.lift{transform:translate(-50%,-50%) scale(1.15);border-color:var(--hi);box-shadow:0 6px 14px rgba(0,0,0,.55);z-index:5;cursor:grabbing}
.tok i{font-style:normal;font-size:10px;min-width:22px;padding:0 2px}.tok b{font-size:11.5px;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tok span{font-size:10px;color:var(--dim)}
.tok em{position:absolute;left:0;bottom:0;height:3px;background:var(--good)}
.tok.sel{border-color:var(--hi);box-shadow:0 0 0 3px var(--hi)}.tok.off{border-color:var(--warn)}.tok.off span{color:var(--warn)}.tok.bad{opacity:.55}
.tok.empty{background:rgba(11,20,64,.6);border-style:dashed;justify-content:center}
.benchp{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;background:var(--deep);border:2px solid var(--line);padding:6px 8px;cursor:pointer;color:var(--fg)}
.benchp .meter{grid-column:1/-1}.benchp.sel{border-color:var(--hi)}.benchp[disabled]{opacity:.45;cursor:not-allowed}
.help p{max-width:70ch;margin:0 0 8px}
/* ---- Touch & iOS ---- */
html{-webkit-text-size-adjust:100%}
button,a,select,input,[data-act],[data-tok]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.endbar{flex-direction:column;align-items:stretch;gap:8px}
.endrow{display:flex;align-items:center;gap:12px}
.tabbar{display:none}
.modal .panel{position:relative}
.modal .panel>h2{padding-right:54px}
.mclose{position:absolute;top:3px;right:4px;z-index:2;background:var(--ink);color:var(--fg);border:2px solid var(--bevl);width:40px;height:40px;font-size:20px;line-height:1;cursor:pointer}
.mlist{display:none;flex-direction:column}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 4px;border-top:1px solid rgba(70,96,207,.4);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--fg);width:100%}
.mrow:first-child{border-top:0}
.mrow.me{background:rgba(255,216,74,.10)}
.mrow .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mrow .sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--dim);align-items:center;font-variant-numeric:tabular-nums}
.mrow .sub b{color:var(--fg)}
.mrow .big{font-family:var(--f-disp);font-size:26px;line-height:1;color:var(--hi);text-align:right}
.mrow .meter{width:64px;min-width:0}
.mlbl{padding:12px 4px 2px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{min-width:0;overflow:hidden;text-align:center;padding:6px 4px;min-height:64px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;background:var(--deep);border:3px solid;border-color:var(--bevl) var(--bevd) var(--bevd) var(--bevl);color:var(--fg);font-family:var(--f-disp);font-size:clamp(16px,4.6vw,20px);cursor:pointer;position:relative}
.tile.on{background:var(--hi);color:var(--ink)}
.tile small{font-family:var(--f-body);font-size:11px;color:var(--dim)}
.tile.on small{color:var(--ink)}
body.lock{overflow:hidden}
.tk-sticky{position:sticky;top:calc(-16px - env(safe-area-inset-top,0px));z-index:3;background:var(--bg);padding-top:4px;display:flex;flex-direction:column;gap:10px;padding-bottom:6px;box-shadow:0 6px 10px -6px rgba(0,0,0,.6)}
@media (pointer:coarse){
  .btn{min-height:44px}
  .btn.sm{min-height:40px;padding:6px 12px}
  .seg button{min-height:42px;padding:8px 13px}
  input,select,textarea{font-size:16px;min-height:44px}
  .menu button{padding:10px 12px 8px}
  tr.click td{padding-top:10px;padding-bottom:10px}
  .tok{min-height:50px;width:68px}
  .benchp{min-height:52px}
}
@media (max-width:700px){
  #menu{display:none!important}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:0 -16px calc(-10px - env(safe-area-inset-bottom,0px));padding:0 0 env(safe-area-inset-bottom,0px);border-top:2px solid var(--line);background:var(--ink)}
  .tabbar button{background:none;border:0;color:var(--dim);font-family:var(--f-disp);font-size:19px;min-height:52px;padding:6px 2px 4px;cursor:pointer;position:relative;line-height:1.05}
  .tabbar button.on{color:var(--hi);box-shadow:inset 0 3px 0 var(--hi)}
  .tabbar .dot{position:absolute;top:8px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--hi)}
  .endbar{padding-bottom:10px}
  .endrow .btn.big{font-size:21px;padding:4px 14px}
  main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  .modal{align-items:flex-end;padding:calc(24px + env(safe-area-inset-top,0px)) 0 0}
  .modal .panel{width:100%;max-width:100%;max-height:88vh;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 24px rgba(0,0,0,.5)}
  .topbar{padding:5px 16px;gap:0 10px}
  .brand{display:none}
  .meta{font-size:12.5px;line-height:1.3}
  .cash{font-size:22px}
  .tk-sticky .seg button{padding:6px 10px}
  .tk-sticky .btn{padding:5px 10px}
  .hide-m{display:none!important}
  .mlist{display:flex}
  .panel>h2{font-size:21px}

function potEst(p){

  const mid=clamp(reach+Math.round((hashN(p.id,3)-.5)*2*err),p.str,99);

function roundRobin(ids){
  /* Kreismethode mit wechselndem Heimrecht: jeder Verein spielt abwechselnd zu Hause und auswärts, höchstens ein Doppel-Heim/Auswärts pro Runde */
  const n=ids.length,arr=shuffle(ids.slice()),rounds=[];
  for(let r=0;r<n-1;r++){const md=[];for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];if(r%2===1)[h,a]=[a,h];md.push([h,a])}rounds.push(md);arr.splice(1,0,arr.pop())}
  return rounds.concat(rounds.map(md=>md.map(([h,a])=>[a,h])));
}
/* Spielplan-Struktur: Rückrunden-Spieltag r+17 ist das gespiegelte Hinspiel von Spieltag r. */
function pairKey(md){return md.map(f=>Math.min(f.h,f.a)+'-'+Math.max(f.h,f.a)).sort().join('|')}
function restoreMirror(lg){
  const sc=S.sched[lg];if(!sc||sc.length!==34)return;
  const lock=sc.map(md=>md.some(f=>f.gh!=null));const key=sc.map(pairKey);
  const swap=(i,j)=>{[sc[i],sc[j]]=[sc[j],sc[i]];[key[i],key[j]]=[key[j],key[i]]};
  for(let r=0;r<34;r++){if(!lock[r])continue;const q=r<17?r+17:r-17;if(lock[q])continue;
    if(key[q]!==key[r]){const j=key.findIndex((k,i)=>i!==r&&!lock[i]&&k===key[r]);if(j<0)continue;swap(q,j)}lock[q]=true}
  const open=[...Array(34).keys()].filter(i=>!lock[i]);const groups={};for(const i of open)(groups[key[i]]=groups[key[i]]||[]).push(sc[i]);
  const pairs=Object.values(groups).filter(g=>g.length===2),rest=Object.values(groups).filter(g=>g.length!==2).flat();
  const out=sc.slice(),used=new Set();let pi=0;
  for(let r=0;r<17;r++){if(lock[r]||lock[r+17]||pi>=pairs.length)continue;out[r]=pairs[pi][0];out[r+17]=pairs[pi][1];used.add(r);used.add(r+17);pi++}
  const left=open.filter(i=>!used.has(i)),lr=rest.concat(pairs.slice(pi).flat());left.forEach((p,i)=>{out[p]=lr[i]});
  for(let i=0;i<34;i++)sc[i]=out[i];
}
/* Repariert Heim/Auswärts-Serien, ohne gespielte Partien zu ändern und ohne die Spiegelung Hin-/Rückrunde aufzubrechen:
   offene Paarungen tauschen ggf. das Heimrecht (Hin- und Rückspiel zusammen), offene Spieltage nur paarweise mit ihrem Rückrunden-Gegenstück. */
function fixVenueStreaks(lg){
  const sc=S.sched[lg];if(!sc||sc.length!==34)return;
  const isOpen=r=>sc[r].every(f=>f.gh==null);
  const pairs=[];for(let r=0;r<17;r++)for(const f of sc[r]){if(f.gh!=null)continue;const mf=sc[r+17].find(x=>x.h===f.a&&x.a===f.h);if(mf&&mf.gh==null)pairs.push([f,mf])}

  const ei=EUR_WEEKS.indexOf(S.week);if(ei>=0&&S.eur&&!S.eur.winner){const r=cupRound(S.eur,ei,'EUR');if(r)rounds.push(r)}
  if(S.makeup&&S.makeup.length){const ms=[];for(const [lg,md,fi] of S.makeup){const f=S.sched[lg][md]&&S.sched[lg][md][fi];if(f&&f.gh==null){f.post=false;ms.push(makeMatch(f.h,f.a,'L'+lg,f))}}S.makeup=[];if(ms.length)rounds.push({label:'Nachholspiele',comp:'NACH',matches:ms})}

      if(S.week<=32&&(wx==='schnee'||wx==='frost')&&!team(f.h).stadium.heiz&&hashN(f.h*97+S.week*13+S.year,5)<.35){f.post=true;(S.makeup=S.makeup||[]).push([lg,S.week-1,fi]);

function computeTable(lg){
  const rows={};for(const t of leagueTeams(lg))rows[t.id]={id:t.id,sp:0,s:0,u:0,n:0,tf:0,ta:0,pts:0,last:[]};
  for(const md of S.sched[lg])for(const f of md){if(f.gh==null)continue;const h=rows[f.h],a=rows[f.a];if(!h||!a)continue;
    const W=S.year<1995?2:3;h.sp++;a.sp++;h.tf+=f.gh;h.ta+=f.ga;a.tf+=f.ga;a.ta+=f.gh;
    if(f.gh>f.ga){h.s++;a.n++;h.pts+=W;h.last.push('S');a.last.push('N')}else if(f.gh<f.ga){a.s++;h.n++;a.pts+=W;h.last.push('N');a.last.push('S')}else{h.u++;a.u++;h.pts++;a.pts++;h.last.push('U');a.last.push('U')}}
  return Object.values(rows).sort((x,y)=>y.pts-x.pts||(y.tf-y.ta)-(x.tf-x.ta)||y.tf-x.tf||team(x.id).name.localeCompare(team(y.id).name));
}

  addNews(hi,'Pressekonferenz',`Vor dem ${why} wollen die Journalisten eine Ansage hören.`,{kind:'act',data:{opp:pick1},acts:[['pcBold','„Wir gewinnen das!“'],['pcHot','„Die Mannschaft brennt.“'],['pcResp','„Respekt vor dem Gegner.“']]});
}
function expireActions(){for(const k in S.news)for(const n of S.news[k])if(n.acts&&!n.done&&n.w<S.week-1){n.done=true;n.res='Keine Antwort, Angebot verfallen.'}}
function transferPlayer(p,toTid,fee){
  if(p.tid){const from=team(p.tid);from.squad=from.squad.filter(i=>i!==p.id);from.lineup=from.lineup.map(i=>i===p.id?null:i);book(from,fee,'transfer')}
  else S.free=S.free.filter(i=>i!==p.id);
  const to=team(toTid);to.squad.push(p.id);p.tid=toTid;p.listed=false;book(to,-fee,'transfer');
}
function releasePlayer(p){
  if(p.tid){const t=team(p.tid);t.squad=t.squad.filter(i=>i!==p.id);t.lineup=t.lineup.map(i=>i===p.id?null:i)}
  p.tid=0;p.listed=false;p.con=0;if(!S.free.includes(p.id))S.free.push(p.id);
}
function removePlayer(p){
  if(p.tid){const t=team(p.tid);t.squad=t.squad.filter(i=>i!==p.id);t.lineup=t.lineup.map(i=>i===p.id?null:i);t.youth=t.youth.filter(i=>i!==p.id)}
  S.free=S.free.filter(i=>i!==p.id);delete S.players[p.id];
}
function endWeek(rounds){
  const wk=S.week;
  for(const t of domestic())if(t.offers&&t.human>=0){chooseSponsor(t,0);addNews(t.human,'Sponsor automatisch gewählt',`Weil keine Entscheidung fiel, hat der Vorstand ${t.sponsor.name} genommen.`)}
  S.lastWeek=[];for(const r of rounds)for(const m of r.matches)S.lastWeek.push({label:r.label,comp:m.comp,h:m.hid,a:m.aid,gh:m.gh,ga:m.ga,pen:m.pen,att:m.att});
  for(const t of S.teams){weeklyTraining(t);if(!t.foreign){weeklyEconomy(t);if(t.human>=0)weeklyFinance(t);progressBuild(t)}}
  marketWeek();
  S.humans.forEach((h,hi)=>{if(h.tid)settleToto(hi,team(h.tid),wk)});
  for(const t of S.teams)if(t.human<0)aiWeekly(t);
  S.humans.forEach((h,hi)=>{
    if(!h.tid)return;const t=team(h.tid);
    resultNews(hi,t,rounds);
    boardWeekly(hi,t,rounds);
    if(!h.tid)return;
    moodWeek(hi,t);
    if(R()<.22)randomEvent(hi,t);
    if(wk===28){const ex=t.squad.map(P).filter(p=>p.con<=1);if(ex.length)addNews(hi,'Auslaufende Verträge',`Diese Verträge enden mit der Saison: ${ex.map(p=>p.n).join(', ')}. Verlängere im Kader, sonst gehen die Spieler ablösefrei.`,{kind:'act'})}
  });
  if(wk>=8)aiCoaches();
  S.week++;expireActions();
  if(S.week>34)seasonEnd();
  else S.humans.forEach((h,hi)=>{if(!h.tid)return;const t=team(h.tid);
    if(windowOpen()){bidsForListed(hi,t);poach(hi,t);if(S.week===4||S.week===19)deadlineDay(hi,t)}
    pressConf(hi,t)});
  S.turn=0;
}
function maintainAI(t){
  const q=t.foreign?t.q:(t.league===1?clamp(teamRating(t),60,80):clamp(teamRating(t),48,66));
  const cnt=c=>t.squad.filter(id=>P(id).pos===c).length;
  for(const [pos,n] of [['TW',2],['AB',6],['MF',6],['ST',4]])while(cnt(pos)<n){const p=genPlayer(q-2,pos,t.id,{age:ri(18,26),nat:natFor(t)});t.squad.push(p.id)}
  while(t.squad.length<21){const p=genPlayer(q-2,pick(['AB','MF','ST']),t.id,{age:ri(18,26),nat:natFor(t)});t.squad.push(p.id)}
  while(t.squad.length>25){const w=t.squad.map(P).filter(p=>p.pos!=='TW'||cnt('TW')>2).sort((a,b)=>effStr(a)-effStr(b))[0];if(!w)break;releasePlayer(w)}
}
function seasonEnd(){
  const t1=computeTable(1),t2=computeTable(2),ts=topScorers(1)[0];
  S.history.unshift({y:yearLabel(),m1:team(t1[0].id).name,m2:team(t2[0].id).name,pok:S.cup.winner?team(S.cup.winner).name:'–',eur:S.eur.winner?team(S.eur.winner).name:'–',tj:ts?`${ts.n} (${team(ts.tid).short}, ${ts.g})`:'–'});
  const down=t1.slice(-3).map(r=>r.id),up=t2.slice(0,3).map(r=>r.id);
  S.humans.forEach((h,hi)=>{
    if(!h.tid)return;const t=team(h.tid),tbl=t.league===1?t1:t2,pos=tbl.findIndex(r=>r.id===t.id)+1;
    let d=pos<=h.target?15+(h.target-pos)*2:-(pos-h.target)*4;
    if(down.includes(t.id))d-=20;if(up.includes(t.id))d+=10;
    if(pos===1){h.titles.push(`${t.league===1?'Meister':'Zweitliga-Meister'} ${yearLabel()} mit ${t.name}`);d+=10}
    h.conf=clamp(h.conf+d,0,100);
    addNews(hi,`Saisonbilanz ${yearLabel()}`,`${t.name} beendet die Saison auf Platz ${pos} (${tbl[pos-1].pts} Punkte). Ziel war: ${TARGET_TXT[t.league][h.target]}.${down.includes(t.id)?' Der Abstieg ist bitter.':''}${up.includes(t.id)?' AUFSTIEG in die Bundesliga!':''}`,{kind:pos<=h.target?'good':'bad'});
    if(h.conf<12)fire(hi,'Nach dieser Saison trennt sich der Verein von dir.');
  });
  down.forEach(id=>{const t=team(id);t.league=2;t.fans=clamp(t.fans-8,5,99)});
  up.forEach(id=>{const t=team(id);t.league=1;t.fans=clamp(t.fans+8,5,99)});
  S.euroQual=t1.slice(0,4).map(r=>r.id);
  for(const p of Object.values(S.players)){
    if(p.yth)continue;p.age++;
    if(p.age<=23)p.str=Math.min(p.pot,p.str+ri(0,4));else if(p.age<=29)p.str=clamp(p.str+ri(-1,2),18,p.pot+2);else if(p.age<=32)p.str-=ri(0,3);else p.str-=ri(1,5);
    p.str=clamp(p.str,18,96);if(p.str>p.pot)p.pot=p.str;ensureP(p);syncSkills(p);
    p.g=0;p.gx=0;p.sp=0;p.yel=0;p.sus=0;p.form=5;p.fit=100;
    const t=p.tid?team(p.tid):null;const hum=t&&t.human>=0;
    if(p.age>=37||(p.age>=35&&R()<.6)||(p.age>=32&&p.str<40&&R()<.5)){if(hum)addNews(t.human,'Karriereende',`${p.n} (${p.age}) beendet seine Laufbahn.`);removePlayer(p);continue}
    if(t){p.con--;if(p.con<=0){
      if(hum){addNews(t.human,'Vertrag ausgelaufen',`${p.n} verlässt den Verein ablösefrei.`);releasePlayer(p)}
      else if(p.age<33&&R()<.75){p.con=ri(1,3);p.sal=pSalary(p)}else releasePlayer(p)}}
  }
  S.free=S.free.filter(id=>S.players[id]);
  const fr=S.free.map(P).sort((a,b)=>b.str-a.str);for(const p of fr.slice(70))removePlayer(p);
  for(let i=0;i<10;i++){const p=genPlayer(ri(50,66),pick(['TW','AB','MF','MF','ST','AB']),0,{nat:R()<.3?pick(NATS):'D'});S.free.push(p.id)}
  for(const t of S.teams)if(t.human<0){maintainAI(t);if(t.foreign)t.q=clamp(t.q+ri(-2,2),64,84)}
  S.year++;S.week=1;
  startSeason(false);
  S.humans.forEach((h,hi)=>{if(!h.tid)return;const t=team(h.tid);ensureSlots(t);
    addNews(hi,`Neue Saison ${yearLabel()}`,`${t.name} spielt in der ${t.league===1?'Bundesliga':'2. Bundesliga'}. Vorgabe des Vorstands: ${TARGET_TXT[t.league][h.target]}. Neue Sponsorangebote liegen vor, und in der Jugendabteilung warten Talente.`,{kind:'act'})});
}

const STOCKS={DAI:['Daimler-Benz',720],SIE:['Siemens',650],DBK:['Deutsche Bank',720],BAS:['BASF',310],VOW:['Volkswagen',440],LHA:['Lufthansa',190],BAY:['Bayer',380],RWE:['RWE',460]};
const PROPS={wohnung:{label:'Eigentumswohnung',price:250,rent:1.6},haus:{label:'Mehrfamilienhaus',price:1100,rent:7.5},buero:{label:'Bürogebäude',price:3800,rent:27}};
function initMarket(){const m={};for(const k in STOCKS)m[k]={p:STOCKS[k][1],h:[STOCKS[k][1]]};return m}
function marketWeek(){if(!S.market)S.market=initMarket();const all=rnd(-.012,.016);for(const k in S.market){const s=S.market[k];s.p=Math.max(20,Math.round(s.p*(1+all+rnd(-.045,.045))*10)/10);s.h.push(s.p);if(s.h.length>26)s.h.shift()}}
function loanLimit(t){return t.league===1?9000:3500}
function totoGames(){if(S.week>34)return [];const a=S.sched[1][S.week-1].slice(0,9),b=S.sched[2][S.week-1].slice(0,2);return a.concat(b)}
function settleToto(hi,t,wk){
  const tt=t.toto;if(!tt||tt.wk!==wk)return;const g=S.sched[1][wk-1].slice(0,9).concat(S.sched[2][wk-1].slice(0,2));
  let ok=0;g.forEach((f,i)=>{const r=f.gh>f.ga?'1':f.gh<f.ga?'2':'0';if(tt.tips[i]===r)ok++});
  const mult=ok===11?2500:ok===10?150:ok===9?12:0;const win=tt.stake*mult;if(win)book(t,win,'finance');
  addNews(hi,'Toto-Ergebnis',`${ok} von 11 richtig.${win?' Gewinn: '+money(win)+'!':' Leider kein Gewinn.'}`,{kind:win?'good':'info'});t.toto=null;
}
function migrate(){
  if(S.settings.dec==null)S.settings.dec=true;if(!S.makeup)S.makeup=[];
  for(const t of S.teams)if(!t.foreign&&t.human<0&&!t.coach)t.coach=genName('D');
  if((S.schedV||0)<3){for(const lg of [1,2]){restoreMirror(lg);fixVenueStreaks(lg)}S.schedV=3}
  if(!S.market)S.market=initMarket();if(S.settings.scenes==null)S.settings.scenes=true;
  for(const p of Object.values(S.players))ensureP(p);
  for(const t of S.teams){if(t.bonus==null)t.bonus=0;if(t.merch==null)t.merch=1;if(t.loan==null)t.loan=0;if(t.depo==null)t.depo=0;if(!t.stocks)t.stocks={};if(!t.props)t.props=[];if(t.human>=0)ensureSlots(t);for(const k of ['catering','merch','finance'])if(t.fin.in[k]==null)t.fin.in[k]=0;for(const k of ['bonus','merch','finance'])if(t.fin.out[k]==null)t.fin.out[k]=0}
  for(const h of S.humans){if(!h.posHist)h.posHist=[];if(h.autoXI==null)h.autoXI=false}
}

function weekFixturesFor(tid){

function posSpark(h,t){
  const ph=(h.posHist||[]).slice(-34);const now=tablePos(t);
  if(!ph.length||ph[ph.length-1]!==now)ph.push(now);
  if(ph.length<2)return '';
  const n=leagueTeams(t.league).length,W=300,H=60,yy=v=>4+(v-1)/(n-1)*(H-8),xx=i=>i*W/(ph.length-1);
  const prev=ph[ph.length-2],d=prev-now;
  const delta=d>0?`<span class="good">▲ ${d}</span>`:d<0?`<span class="bad">▼ ${-d}</span>`:'<span class="dim">=</span>';
  const best=Math.min(...ph),worst=Math.max(...ph);
  const pts=ph.map((v,i)=>`${xx(i).toFixed(1)},${yy(v).toFixed(1)}`).join(' ');
  const dots=ph.map((v,i)=>`<circle cx="${xx(i).toFixed(1)}" cy="${yy(v).toFixed(1)}" r="${i===ph.length-1?3.5:1.6}" fill="var(--hi)"><title>${i+1}. Spieltag: Platz ${v}</title></circle>`).join('');
  return `<div style="margin-top:12px"><div class="row" style="justify-content:space-between"><span class="lbl">Tabellenplatz-Trend</span><span class="small">Platz <b>${now}.</b> ${delta} <span class="dim">zum Vorspieltag</span></span></div>
  <svg viewBox="-4 0 ${W+8} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="Verlauf des Tabellenplatzes, aktuell Platz ${now}"><line x1="0" x2="${W}" y1="${yy(h.target)}" y2="${yy(h.target)}" stroke="var(--good)" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke"/><polyline fill="none" stroke="var(--hi)" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts}"/>${dots}</svg>
  <div class="small dim">Beste Platzierung ${best}., schlechteste ${worst}. · Gestrichelt: Saisonziel Platz ${h.target}</div></div>`}
function fixRow(f,me,label){
  const played=f.gh!=null;const pen=f.pen?`<div class="small dim c">i. E. ${f.pen[0]}:${f.pen[1]}</div>`:'';
  return `<div class="fx${f.h===me||f.a===me?' me':''}"><div class="h${played&&(f.gh>f.ga||(f.pen&&f.pen[0]>f.pen[1]))?' w':''}">${tname(f.h)}</div><div><div class="s">${played?f.gh+':'+f.ga:f.post?'abg.':'–:–'}</div>${pen}${label?`<div class="small dim c">${esc(label)}</div>`:''}</div><div class="a${played&&(f.ga>f.gh||(f.pen&&f.pen[1]>f.pen[0]))?' w':''}">${tname(f.a)}</div></div>`;
}

function viewTraining(){
  const t=curTeam();const half=S.week<=17?0:1;const cost=t.league===1?400:200;

   <div class="seg" style="margin-bottom:8px">${['leicht','normal','hart'].map(k=>`<button data-act="setTrain" data-k="${k}" class="${t.train===k?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>

  </div></div>
  <div class="panel"><h2>Einzeltraining <small>Stärken ausbauen, Schwächen beheben</small></h2><div class="bd tw">
   <div class="lbl">Für die ganze Mannschaft</div>

function tryBuy(id,fct,auc){

function playScene(m,e){
  const cv=document.getElementById('scene');if(!cv){TK.scene=null;startTimer();return}
  const x=cv.getContext('2d');const att=team(e.s?m.aid:m.hid),def=team(e.s?m.hid:m.aid);const W=160,H=72;const T=2600;const t0=performance.now();
  const shooter={x:30,y:rnd(24,48)},mate={x:14,y:rnd(14,58)};const tx=146,ty=rnd(30,42);const defs=[[96,26],[104,44],[90,52],[112,34]].map(([a,b])=>({x:a+rnd(-6,6),y:b+rnd(-5,5)}));
  const fin=()=>{if(!TK||!TK.scene)return;TK.scene=null;renderTicker();if(TK.live&&!TK.ht&&!TK.live.fin)startTimer()};TK.sceneEnd=fin;
  const fig=(px,py,c1,c2)=>{x.fillStyle=c1;x.fillRect(px-1,py-2,3,4);x.fillStyle=c2;x.fillRect(px-1,py+2,3,2);x.fillStyle='#f2d0a9';x.fillRect(px-1,py-4,3,2)};
  const draw=now=>{if(!TK||!TK.scene)return;const k=Math.min(1,(now-t0)/T);
    for(let i=0;i<W;i+=8){x.fillStyle=(i/8)%2?'#1f7a3a':'#25893f';x.fillRect(i,0,8,H)}
    x.fillStyle='#e9eeff';x.fillRect(0,2,W,1);x.fillRect(0,H-3,W,1);x.fillRect(120,14,1,44);x.fillRect(120,14,30,1);x.fillRect(120,57,30,1);
    x.fillStyle='#d8dde8';x.fillRect(150,24,6,24);x.fillStyle='rgba(255,255,255,.35)';for(let yy=24;yy<48;yy+=3)x.fillRect(150,yy,6,1);
    const run=Math.min(1,k/0.45);const sx=shooter.x+run*82,sy=shooter.y+(ty-shooter.y)*run*.4;
    defs.forEach((d,i)=>fig(d.x+(sx-d.x)*.12*run,d.y+Math.sin(now/120+i)*1,def.c1,def.c2));
    fig(mate.x+run*50,mate.y+(36-mate.y)*run*.3,att.c1,att.c2);
    const kx=147,ky=36+(k>.5?(ty-36)*Math.min(1,(k-.5)*4)*.6:0);x.fillStyle='#ffd84a';x.fillRect(kx-1,ky-3,3,6);
    fig(sx,sy,att.c1,att.c2);
    let bx,by;if(k<.45){bx=sx+3;by=sy+2}else{const q=Math.min(1,(k-.45)/.17);bx=sx+3+(tx+6-(sx+3))*q;by=sy+2+(ty-(sy+2))*q-Math.sin(q*Math.PI)*6}
    x.fillStyle='#fff';x.fillRect(Math.round(bx),Math.round(by),2,2);
    if(k>.62){x.fillStyle='rgba(5,7,15,.6)';x.fillRect(0,22,W,28);x.fillStyle='#ffcf2e';x.font='bold 18px monospace';x.textAlign='center';x.textBaseline='middle';x.fillText('TOR!',W/2,31+Math.sin(now/90)*1);x.font='bold 9px monospace';x.fillStyle='#e9eeff';x.fillText(`${e.min}'  ${e.n.split(' ').slice(-1)[0]}  ${e.sc}`,W/2,44)}
    if(k<1)requestAnimationFrame(draw);else setTimeout(fin,350)};
  requestAnimationFrame(draw);
}

let DRAG=null;
/* Touch: Scrollen bleibt frei; Ziehen erst nach kurzem Gedrückthalten (Long-Press). Maus: sofort ziehen. */
function lineupPointer(){
  const start=(tok,x,y,touch)=>{const pitch=document.getElementById('pitch');if(!pitch)return;
    DRAG={i:+tok.dataset.tok,el:tok,x0:x,y0:y,t0:Date.now(),moved:false,drag:!touch,rect:pitch.getBoundingClientRect(),touch};
    if(touch)DRAG.timer=setTimeout(()=>{if(DRAG&&!DRAG.moved){DRAG.drag=true;DRAG.rect=pitch.getBoundingClientRect();tok.classList.add('lift')}},230)};
  const move=(x,y,ev)=>{if(!DRAG)return;const dx=x-DRAG.x0,dy=y-DRAG.y0;
    if(!DRAG.drag){if(Math.hypot(dx,dy)>8){DRAG.moved=true;clearTimeout(DRAG.timer);if(DRAG.touch)DRAG=null;else DRAG.drag=true}if(!DRAG||!DRAG.drag)return}
    if(ev&&ev.cancelable)ev.preventDefault();DRAG.moved=true;
    const r=DRAG.rect;const px=clamp((x-r.left)/r.width*100,5,95),py=clamp((y-r.top)/r.height*100,5,96);DRAG.el.style.left=px+'%';DRAG.el.style.top=py+'%';DRAG.px=px;DRAG.py=py};
  const end=()=>{if(!DRAG)return;const d=DRAG;DRAG=null;clearTimeout(d.timer);d.el.classList.remove('lift');const t=curTeam();if(!t)return;
    if(d.drag&&d.px!=null){ensureSlots(t);t.slots[d.i]={x:Math.round(d.px),y:Math.round(d.py)};render()}
    else if(!d.moved&&Date.now()-d.t0<450)lineupTap(d.i)};
  document.addEventListener('touchstart',e=>{const tok=e.target.closest('[data-tok]');if(!tok||e.touches.length>1)return;const p=e.touches[0];start(tok,p.clientX,p.clientY,true)},{passive:true});
  document.addEventListener('touchmove',e=>{if(!DRAG)return;const p=e.touches[0];move(p.clientX,p.clientY,e)},{passive:false});
  document.addEventListener('touchend',e=>{if(DRAG){if(DRAG.drag||(!DRAG.moved))e.preventDefault();end()}},{passive:false});
  document.addEventListener('touchcancel',()=>{if(DRAG){clearTimeout(DRAG.timer);DRAG.el.classList.remove('lift');DRAG=null}});
  document.addEventListener('mousedown',e=>{const tok=e.target.closest('[data-tok]');if(!tok||e.button!==0)return;e.preventDefault();start(tok,e.clientX,e.clientY,false);DRAG.drag=false});
  document.addEventListener('mousemove',e=>{if(DRAG&&!DRAG.touch)move(e.clientX,e.clientY,e)});
  document.addEventListener('mouseup',()=>{if(DRAG&&!DRAG.touch)end()});
}

/* =========================== TICKER =========================== */
let TK=null;
const SPEED={langsam:420,normal:150,schnell:45};
function humanInMatch(m){return team(m.hid).human>=0||team(m.aid).human>=0}
function playWeek(){TK={rounds:weekRounds(),ri:0,timer:null,live:null,ht:false,htDone:false};nextRound()}
function nextRound(){
  while(TK.ri<TK.rounds.length){
    const r=TK.rounds[TK.ri];
    if(S.settings.speed==='sofort'||!r.matches.some(humanInMatch)){for(const m of r.matches)while(!m.done)simMinute(m);finishRound(r);r.fin=true;TK.ri++;continue}
    TK.live=r;TK.ht=false;TK.htDone=false;TK.dec=null;r.fin=false;$('#ov').hidden=false;for(const m of r.matches){m._seen=0;m.interactive=S.settings.dec!==false&&humanInMatch(m)}sndMode('match');sndWhistle([1.1]);renderTicker();startTimer();return;
  }
  endWeek(TK.rounds);sndMode('menu');showSummary();
}
function startTimer(){stopTimer();TK.timer=setInterval(tick,SPEED[S.settings.speed]||150)}
function stopTimer(){if(TK&&TK.timer){clearInterval(TK.timer);TK.timer=null}}
function tick(){
  const r=TK.live;if(!r)return;
  for(const m of r.matches)if(!m.done)simMinute(m);
  sndEvents(r);
  if(S.settings.scenes&&S.settings.speed!=='schnell'){for(const m of r.matches){if(!humanInMatch(m))continue;const g=m.ev.find(e=>e.t==='goal'&&e.min===m.min&&!e._sc);if(g){g._sc=1;stopTimer();TK.scene={m,e:g};renderTicker();playScene(m,g);return}}}
  if(S.settings.dec!==false){for(const m of r.matches){if(!humanInMatch(m)||m.done)continue;
    if(m.pend){stopTimer();TK.dec={m};if(m.pend.k==='pen')sndWhistle([.5]);renderTicker();return}
    for(let s=0;s<2;s++){if(team(s?m.aid:m.hid).human<0)continue;const my=s?m.ga:m.gh,op=s?m.gh:m.ga;
      if(m.min>=70&&m.min<87&&my<op&&!m.asked[s].push&&m.style[s]!=='allin'){m.asked[s].push=1;stopTimer();TK.dec={m,k:'push',s};renderTicker();return}
      if(m.min>=75&&m.min<87&&my-op===1&&!m.asked[s].bus&&m.style[s]!=='bus'){m.asked[s].bus=1;stopTimer();TK.dec={m,k:'bus',s};renderTicker();return}}}}
  const mins=r.matches.filter(m=>!m.done).map(m=>m.min);
  if(S.settings.halftime&&!TK.htDone&&r.matches.some(m=>humanInMatch(m)&&m.min>=45&&!m.done)){TK.htDone=true;TK.ht=true;stopTimer();sndWhistle([.55,.9]);renderTicker();return}
  if(!mins.length){stopTimer();finishRound(r);r.fin=true;sndWhistle([.22,.22,1.2])}
  renderTicker();
}
function skipRound(){const r=TK.live;stopTimer();TK.dec=null;for(const m of r.matches){m.interactive=false;while(!m.done)simMinute(m)}for(const m of r.matches)m._seen=m.ev.length;TK.ht=false;finishRound(r);r.fin=true;sndWhistle([.22,.22,1.2]);renderTicker()}
function evLine(e,m){
  const side=e.s>=0?team(e.s?m.aid:m.hid).short:'';
  const lab={goal:['goal','TOR'],yel:['yel','GELB'],red:['red',e.gr?'G-ROT':'ROT'],inj:['inj','VERL.'],sub:['sub','WECHSEL'],info:['info','INFO'],chance:['info','CHANCE']}[e.t];
  const txt=e.t==='goal'?`<b>${esc(e.n)}</b>${e.pen?' (Elfmeter)':''} (${esc(side)}) · ${e.sc}`:e.t==='sub'?`${esc(e.n)} für ${esc(e.out)} (${esc(side)})`:e.t==='inj'?`${esc(e.n)} (${esc(side)}) muss raus${e.ty?': '+esc(e.ty):''}`:e.t==='info'||e.t==='chance'?esc(e.txt)+(e.t==='chance'?` (${esc(side)})`:''):`${esc(e.n)} (${esc(side)})`;
  return `<li><span class="m">${e.min}'</span><span class="ev ${lab[0]}">${lab[1]}</span><span>${txt}</span></li>`;
}
function kraft(m,s){const on=m.on[s];return on.length?Math.round(on.reduce((a,id)=>a+P(id).fit,0)/on.length):0}

  const others=r.matches.filter(m=>!humanInMatch(m));

  const sp=S.settings.speed;
  const ctl=r.fin?`<button class="btn pri big" data-act="tkNext">Weiter ▸</button>`:TK.ht?'':`<div class="seg">${[['langsam','Langsam'],['normal','Normal'],['schnell','Schnell']].map(([k,l])=>`<button data-act="tkSpeed" data-k="${k}" class="${sp===k?'on':''}">${l}</button>`).join('')}</div><button class="btn" data-act="tkPause">Pause / Wechsel</button><button class="btn" data-act="tkSkip">Zum Ergebnis</button>`;
  const keep=ov.scrollTop;ov.innerHTML=`<div class="ov-in"><div class="tk-sticky"><div class="tk-head"><div><div class="lbl">Konferenz · ${yearLabel()}</div><h1>${esc(r.label)}</h1></div><div style="text-align:right"><div class="clock">${clock}</div>${muteBtn()}</div></div>${TK.dec?'':`<div class="row">${ctl}</div>`}</div>${TK.dec?decPanel():''}${TK.scene?'<canvas id="scene" class="stadium" width="160" height="72" style="aspect-ratio:160/72;cursor:pointer" data-act="sceneSkip" aria-label="Torszene"></canvas>':''}${TK.ht?htPanel(hm):''}<div class="grid">${cards}</div>${listHTML}</div>`;ov.scrollTop=(TK.dec||TK.ht)?0:keep;lockScroll();
}
function decPanel(){

/* =========================== SOUND =========================== */
/* Eigene Komposition und synthetische Geräusche, alles per Web Audio erzeugt. */
const SND={ctx:null,on:{music:true,sfx:true},vol:.7,mode:'menu',seqT:null,step:0,next:0,crowd:null,crowdT:null,chantAt:0,lastChime:0};
function sndLoad(){try{const d=JSON.parse(lsGet('flm_audio')||'{}');if(d.on)SND.on=Object.assign(SND.on,d.on);if(typeof d.vol==='number')SND.vol=d.vol}catch(e){}}
function sndSave(){lsSet('flm_audio',JSON.stringify({on:SND.on,vol:SND.vol}))}
function muteBtn(){const on=SND.on.music||SND.on.sfx;return `<button class="mute" data-act="mute" aria-label="${on?'Ton aus':'Ton an'}" title="${on?'Ton aus':'Ton an'}">♪ ${on?'AN':'AUS'}</button>`}
function sndInit(){
  if(SND.ctx){if(SND.ctx.state==='suspended')SND.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let c;try{c=new AC()}catch(e){return}
  SND.ctx=c;SND.master=c.createGain();SND.master.gain.value=SND.vol;SND.master.connect(c.destination);
  const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(SND.master);

  sceneSkip:()=>{if(TK&&TK.sceneEnd)TK.sceneEnd()},
  bank:d=>{const t=curTeam(),a=+$('#bk-amt').value;
    if(d.k==='loan'){if(t.loan+a>loanLimit(t))return toast('Die Bank gibt nicht mehr Kredit.');t.loan+=a;t.cash+=a}
    else if(d.k==='repay'){const v=Math.min(a,t.loan);if(!v)return toast('Kein Kredit offen.');if(t.cash<v)return toast('Nicht genug Geld zum Tilgen.');t.loan-=v;t.cash-=v}
    else if(d.k==='depo'){if(t.cash<a)return toast('Nicht genug Geld auf dem Konto.');t.depo+=a;t.cash-=a}
    else{const v=Math.min(a,t.depo);if(!v)return toast('Kein Festgeld vorhanden.');t.depo-=v;t.cash+=v}
    render()},
  stock:d=>{const t=curTeam(),q=+d.q,pr=S.market[d.k].p;const val=Math.abs(q)*pr/1000;const fee=val*.01;t.stocks=t.stocks||{};
    if(q>0){if(t.cash-val-fee<-2000)return toast('Nicht genug Geld.');t.cash-=val;book(t,-fee,'finance');t.stocks[d.k]=(t.stocks[d.k]||0)+q}
    else{if((t.stocks[d.k]||0)<-q)return;t.cash+=val;book(t,-fee,'finance');t.stocks[d.k]+=q}render()},
  propBuy:d=>{const t=curTeam(),pr=PROPS[d.k];if(t.cash-pr.price<-2000)return toast('Nicht genug Geld.');t.cash-=pr.price;(t.props=t.props||[]).push({k:d.k,val:pr.price});toast(pr.label+' gekauft.');render()},
  propSell:d=>{const t=curTeam(),pr=t.props[+d.i];t.cash+=pr.val;t.props.splice(+d.i,1);toast('Verkauft für '+money(pr.val)+'.');render()},
  totoTip:d=>{if(!UI.toto||UI.toto.wk!==S.week)UI.toto={wk:S.week,tips:Array(totoGames().length).fill('')};UI.toto.tips[+d.i]=d.v;render()},
  totoSubmit:()=>{const t=curTeam(),st=+$('#toto-stake').value;if(!UI.toto||!UI.toto.tips.every(Boolean))return;if(t.cash-st<-2000)return toast('Nicht genug Geld.');book(t,-st,'finance');t.toto={wk:S.week,tips:UI.toto.tips.slice(),stake:st};UI.toto=null;toast('Totoschein abgegeben.');render()},
  player:(d,el,e)=>{e&&e.preventDefault();UI.confirm=null;playerModal(+d.id)},
  extend:d=>{const p=P(+d.id);const y=+d.y;p.sal=Math.round(pSalary(p)*1.15/5)*5;p.con=y+1;closeModal();toast(`${p.n} verlängert bis ${S.year+p.con}.`);render()},
  list:d=>{const p=P(+d.id);p.listed=!p.listed;if(!$('#modal').hidden)playerModal(p.id);render()},
  sellNow:d=>{const p=P(+d.id),t=curTeam();if(!windowOpen())return toast(windowText());if(t.squad.length<=16)return toast('Mindestens 16 Spieler müssen im Kader bleiben.');
    const buyers=domestic().filter(x=>x.human<0&&x.squad.length<28);const b=pick(buyers);const amt=Math.round(pValue(p)*.6/10)*10;transferPlayer(p,b.id,amt);UI.confirm=null;closeModal();toast(`${p.n} wechselt zu ${b.name}.`);addNews(S.turn,'Verkauf',`${p.n} geht für ${money(amt)} zu ${b.name}.`);render()},
  release:d=>{const p=P(+d.id),t=curTeam();if(t.squad.length<=16)return toast('Mindestens 16 Spieler müssen im Kader bleiben.');const sev=Math.round(p.sal*p.con*.5);book(t,-sev,'other');releasePlayer(p);UI.confirm=null;closeModal();toast(`${p.n} wurde entlassen.`);render()},
  setForm:d=>{curTeam().tactic.form=d.f;render()},
  setStyle:d=>{curTeam().tactic.style=d.s;render()},
  setHart:d=>{curTeam().tactic.hart=d.h==='1';render()},
  setTrain:d=>{curTeam().train=d.k;render()},
  camp:()=>{const t=curTeam(),half=S.week<=17?0:1,cost=t.league===1?400:200;if(t.camp[half])return;if(t.cash-cost<-2000)return toast('Nicht genug Geld.');book(t,-cost,'other');t.camp[half]=true;for(const id of t.squad){const p=P(id);p.form=clamp(p.form+1.5,1,10);p.fit=clamp(p.fit+10,0,100)}toast('Trainingslager absolviert: Form und Fitness steigen.');render()},
  setLg:d=>{UI.lg=+d.l;render()},
  md:d=>{UI.md=clamp((UI.md??0)+ +d.d,0,33);render()},
  mk:d=>{UI.mk[d.k]=d.v;render()},
  buyModal:d=>{UI.buyY=2;buyModal(+d.id)},
  buyY:d=>{UI.buyY=+d.y;buyModal(+d.id)},
  buy:d=>tryBuy(+d.id,+d.f),
  auction:d=>tryBuy(+d.id,+d.f,true),
  build:d=>{const t=curTeam(),b=BUILD[d.k];if(t.cash-b.cost<-3000)return toast('Nicht genug Geld für dieses Projekt.');book(t,-b.cost,'build');t.build.push({k:d.k,left:b.weeks});toast(`Baubeginn: ${b.label}`);render()},
  youthUp:()=>{const t=curTeam(),c=t.youthLvl*600;if(t.cash-c<-2000)return toast('Nicht genug Geld.');book(t,-c,'build');t.youthLvl++;toast(`Jugendabteilung jetzt Stufe ${t.youthLvl}.`);render()},
  promote:d=>{const t=curTeam(),p=P(+d.id);if(t.squad.length>=30)return toast('Kader voll.');t.youth=t.youth.filter(i=>i!==p.id);p.yth=false;p.con=3;p.sal=pSalary(p);t.squad.push(p.id);toast(`${p.n} erhält einen Profivertrag.`);render()},
  endTurn:()=>{
    const h=cur();if(!h.tid)return toast('Unterschreibe zuerst bei einem neuen Verein.');
    const t=curTeam();if(t.offers){chooseSponsor(t,0);toast(`Sponsor automatisch gewählt: ${t.sponsor.name}`)}
    S.turn++;
    if(S.turn<S.humans.length){UI.view='office';render();showHandover();return}
    S.turn=S.humans.length-1;playWeek();
  },
  handoverGo:()=>{$('#ov').hidden=true;lockScroll();UI.view='office';render();window.scrollTo(0,0)},
  tkSpeed:d=>{S.settings.speed=d.k;startTimer();renderTicker()},
  tkPause:()=>{stopTimer();TK.ht=true;renderTicker()},
  tkSkip:()=>skipRound(),
  tkNext:()=>{TK.ri++;TK.live=null;nextRound()},
  htStyle:d=>{const m=TK.live.matches[+d.m];m.style[+d.s]=d.v;m.str[+d.s]=null;renderTicker()},
  htSub:d=>{const m=TK.live.matches[+d.m],s=+d.s;const o=+$(`#ht-out-${d.m}-${s}`).value,i=+$(`#ht-in-${d.m}-${s}`).value;if(!subst(m,s,o,i))toast('Wechsel nicht möglich.');renderTicker()},
  decide:d=>{const dc=TK.dec;if(!dc)return;const m=dc.m;const p=m.pend;const v=d.v;
    if(p&&p.k==='pen'){m.pend=null;takePenalty(m,p.s,+v.split(':')[1])}
    else if(p&&p.k==='inj'){m.pend=null;const id=+v.split(':')[1];if(id&&benchOf(m,p.s).includes(id)){m.on[p.s].push(id);m.role[p.s][id]=p.role;m.played[p.s].add(id);m.used[p.s]++;m.str[p.s]=null;addEv(m,p.s,'sub',P(id),{out:p.name})}}
    else if(p&&p.k==='red'){m.pend=null;if(v==='redDef'){const out=m.on[p.s].map(P).filter(x=>(m.role[p.s][x.id]||x.pos)==='ST').sort((a,b)=>a.fit-b.fit)[0]||m.on[p.s].map(P).filter(x=>(m.role[p.s][x.id]||x.pos)==='MF').sort((a,b)=>a.fit-b.fit)[0];const inn=benchOf(m,p.s).map(P).filter(x=>x.pos==='AB').sort((a,b)=>effStr(b)-effStr(a))[0];if(out&&inn){subst(m,p.s,out.id,inn.id);m.role[p.s][inn.id]='AB'}}}
    else if(dc.k==='push'||dc.k==='bus'){if(v!=='stay'){m.style[dc.s]=v;m.str[dc.s]=null;addEv(m,dc.s,'info',null,{txt:v==='allin'?`${team(dc.s?m.aid:m.hid).short} wirft alles nach vorne`:`${team(dc.s?m.aid:m.hid).short} zieht sich zurück und mauert`})}}
    TK.dec=null;renderTicker();startTimer()},
  htGo:()=>{TK.ht=false;TK.scene=null;sndWhistle([.7]);renderTicker();startTimer()},
  mute:()=>{sndInit();const any=SND.on.music||SND.on.sfx;SND.on.music=SND.on.sfx=!any;sndSave();sndApplyMode();render();if(TK&&TK.live)renderTicker()},
  sndSet:d=>{sndInit();SND.on[d.k]=d.v==='1';sndSave();sndApplyMode();render()},
  sumClose:()=>{$('#ov').hidden=true;lockScroll();TK=null;S.turn=0;UI.view='office';autosave();render();window.scrollTo(0,0);if(S.humans.length>1)showHandover()}
};
function resolveNews(id,k){
  const arr=S.news[S.turn]||[];const n=arr.find(x=>x.id===id);if(!n||n.done)return;const t=curTeam();const d=n.data||{};
  switch(k){
    case 'raiseY':{const p=P(d.pid);if(p&&p.tid===t.id){p.sal=Math.round(p.sal*1.25);p.form=clamp(p.form+1.5,1,10);n.res=`Gehalt erhöht. ${p.n} ist motiviert.`}else n.res='Hat sich erledigt.';break}
    case 'raiseN':{const p=P(d.pid);if(p&&p.tid===t.id){p.form=clamp(p.form-2.5,1,10);n.res=`${p.n} ist verärgert, seine Form leidet.`}else n.res='Hat sich erledigt.';break}
    case 'friendY':book(t,d.amount,'other');for(const id of t.squad){const p=P(id);p.fit=clamp(p.fit-8,0,100)}n.res=`${money(d.amount)} kassiert.`;break;
    case 'friendN':n.res='Abgesagt.';break;
    case 'fanY':t.price.steh=Math.max(3,t.price.steh-2);t.fans=clamp(t.fans+3,5,99);n.res=`Stehplatz kostet jetzt ${t.price.steh} DM. Die Fans sind dankbar.`;break;
    case 'fanN':t.fans=clamp(t.fans-2,5,99);n.res='Die Fans protestieren mit Spruchbändern.';break;
    case 'bidY':{const p=P(d.pid);if(p&&p.tid===t.id&&t.squad.length>16){transferPlayer(p,d.tid,d.amount);n.res=`${p.n} wechselt für ${money(d.amount)} zu ${team(d.tid).name}.`}else n.res='Transfer nicht mehr möglich.';break}
    case 'bidN':n.res='Angebot abgelehnt.';break;
    case 'poachN':{const p=P(d.pid);if(p&&p.tid===t.id){ensureP(p);p.mood=clamp(p.mood-(p.ch==='diva'?15:6),0,100)}n.res='Abgelehnt. Der Spieler ist enttäuscht.';break}
    case 'moodTalk':{const p=P(d.pid);if(p&&p.tid===t.id){p.sal=Math.round(p.sal*1.1);p.mood=clamp(p.mood+22,0,100)}n.res='Das Gespräch hat geholfen.';break}
    case 'moodList':{const p=P(d.pid);if(p&&p.tid===t.id){p.listed=true;p.mood=clamp(p.mood+10,0,100)}n.res='Er steht jetzt auf der Transferliste.';break}
    case 'moodIgnore':{const p=P(d.pid);if(p&&p.tid===t.id){p.mood=clamp(p.mood-5,0,100);p.form=clamp(p.form-1,1,10)}n.res='Die Stimmung wird nicht besser.';break}
    case 'scFine':{const p=P(d.pid);book(t,25,'other');if(p){ensureP(p);p.mood=clamp(p.mood-10,0,100)}n.res='25 TDM Geldstrafe verhängt.';break}
    case 'scSusp':{const p=P(d.pid);if(p&&p.tid===t.id){p.sus=Math.max(p.sus,2);p.mood=clamp(p.mood-20,0,100)}S.humans[S.turn].conf=clamp(S.humans[S.turn].conf+2,0,100);n.res='Suspendiert. Der Vorstand begrüßt die klare Linie.';break}
    case 'scIgnore':S.humans[S.turn].conf=clamp(S.humans[S.turn].conf-2,0,100);t.fans=clamp(t.fans-1,5,99);n.res='Die Presse spricht von Führungsschwäche.';break;
    case 'pcBold':t.press={wk:S.week,k:'bold',opp:d.opp};n.res='Kampfansage. Mehr Zuschauer, aber eine Niederlage wird teuer.';break;
    case 'pcHot':t.press={wk:S.week,k:'hot',opp:d.opp};n.res='Die Mannschaft ist heiß (+2 % Stärke im Spiel).';break;
    case 'pcResp':t.press={wk:S.week,k:'resp',opp:d.opp};n.res='Sachliche Worte, keine Risiken.';break;
    case 'dlBuy':{const p=P(d.pid);if(!p||!p.tid||team(p.tid).human>=0){n.res='Hat sich erledigt.';break}if(t.squad.length>=30){n.res='Kader voll.';break}if(t.cash-d.amount<-2000){n.res='Nicht genug Geld.';break}const from=team(p.tid).name;transferPlayer(p,t.id,d.amount);p.sal=wageDemand(p);p.con=2;n.res=`${p.n} kommt von ${from}.`;break}
    case 'dlNo':n.res='Abgelehnt.';break;
  }
  n.done=true;render();
}
const CHG={
  formation:el=>{const t=curTeam();t.tactic.form=el.value;t.slots=formSlots(el.value);render()},
  focusSel:el=>{const p=P(+el.dataset.id);p.tf=el.value||null;const t=team(p.tid);if(t&&t.tfMode&&t.tfMode!=='none')t.tfMode='manual';render()},
  mkSrc:el=>{UI.mk.src=el.value;render()},
  mkMax:el=>{UI.mk.max=el.value;render()},
  mkSort:el=>{UI.mk.sort=el.value;render()},
  price:el=>{const t=curTeam();const k=el.dataset.k;const v=clamp(Math.round(+el.value||0),k==='steh'?3:8,k==='steh'?60:150);t.price[k]=v;render()},
  edTeam:el=>{UI.ed=+el.value;render()},
  edName:el=>{const v=el.value.trim();if(v)team(UI.ed).name=v;render()},
  edShort:el=>{const v=el.value.trim();if(v)team(UI.ed).short=v;render()},
  edC:el=>{team(UI.ed)[el.dataset.k]=el.value;render()},
  edPlayer:el=>{const v=el.value.trim();if(v)P(+el.dataset.id).n=v},
  vol:el=>{SND.vol=clamp(+el.value/100,0,1);if(SND.master)SND.master.gain.value=SND.vol;sndSave()}
};


/* ---------- App-Version: Spielstand als Datei ---------- */
ACT.fileSave=()=>{try{const blob=new Blob([JSON.stringify({meta:snapshotMeta(),s:S})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`flutlicht-${yearLabel().replace('/','-')}-sp${Math.min(S.week,34)}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Spielstand-Datei erstellt.')}catch(e){toast('Speichern als Datei nicht möglich.')}};
ACT.fileLoad=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(txt=>{try{const d=JSON.parse(txt);const s=d.s||d;if(!s.teams||!s.players)throw 0;S=s;UI.view='office';autosave();render();toast('Spielstand geladen.')}catch(e){toast('Diese Datei ist kein gültiger Spielstand.')}})};i.click()};

/* =========================== START =========================== */
if(typeof document!=='undefined'){
  sndLoad();
  lineupPointer();
  document.addEventListener('pointerdown',e=>{sndInit();if(e.target.closest('button,.click'))blip()},{capture:true});
  document.addEventListener('keydown',()=>sndInit(),{once:true});
  document.addEventListener('visibilitychange',()=>{if(!SND.ctx)return;if(document.hidden)SND.ctx.suspend();else SND.ctx.resume()});
  document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){if(el.tagName==='A')e.preventDefault();f(el.dataset,el,e)}});
  document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
  $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
  try{window.claude?.hot?.snapshot?.(()=>({S,UI:{view:UI.view,lg:UI.lg}}))}catch(e){}
  const boot=data=>{if(data&&data.S&&data.S.teams){S=data.S;migrate();Object.assign(UI,data.UI||{})}render()};
  try{window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{})}catch(e){boot({})}
}
</script>

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
